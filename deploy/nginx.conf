# GOSpeak Nginx 反向代理配置
# 用法: 放入 deploy/nginx.conf, nginx 容器或宿主 nginx 引用
# 后端默认 8998, 前端静态资源由 Go 服务 (Dockerfile 内嵌 /app/static)
#
# 拓扑:
#   client → nginx(443/80) → Go 后端 :8998 (/ + /api + /ws + /static)
#   client → nginx(443/80) → SRS :1985 (/rtc/v1/whip + /rtc/v1/whep)
#   client → SRS :8000/udp (WebRTC media, 直连)
#
# 若前端单独部署 (dev 或独立静态服务), 另起 upstream 指向。

# WebRTC 媒体口 8000/udp 应由 SRS 直暴露到宿主；nginx stream UDP 反代会改写源地址，ICE 易失败

# ── HTTP 反向代理 ──────────────────────────────────────────────────

upstream gospeak_backend {
    server 127.0.0.1:8998;
    keepalive 32;
}

upstream gospeak_srs_http_api {
    server 127.0.0.1:1985;
    keepalive 16;
}

# WebSocket upgrade map (必需, /ws)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # ── HTTPS 重定向 (生产启用 SSL 后打开) ─────────────────────
    # return 301 https://$host$request_uri;

    # ── 健康检查直通 ───────────────────────────────────────────
    location = /ping {
        proxy_pass http://gospeak_backend;
        access_log off;
    }

    # ── WebSocket 信令 (WebSocket) ─────────────────────────────
    # 必须先于 / 匹配, 且开启 upgrade
    location /ws {
        proxy_pass http://gospeak_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接, 不缓冲
        proxy_buffering off;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # ── API 反向代理 ───────────────────────────────────────────
    location /api/ {
        proxy_pass http://gospeak_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
    }

    # ── SRS WHIP/WHEP 反向代理 ───────────────────────────────
    # 前端 SRS client 使用同源 /rtc/v1/whip/ 和 /rtc/v1/whep/。
    # 这里转发到 SRS HTTP API(默认 :1985), 避免浏览器跨域和暴露 SRS HTTP 端口。
    location /rtc/v1/ {
        proxy_pass http://gospeak_srs_http_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ── Swagger UI ─────────────────────────────────────────────
    location /swagger/ {
        proxy_pass http://gospeak_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── 静态资源缓存 (前端 SPA, Go 托管) ───────────────────────
    # 前端构建产物含 hash, 可激进缓存
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|ico|webp)$ {
        proxy_pass http://gospeak_backend;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # ── SPA 入口 (兜底, 前端路由交给 index.html) ───────────────
    location / {
        proxy_pass http://gospeak_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 常见安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ── HTTPS + HTTP/2 (生产启用) ──────────────────────────────────
# 直接使用完整模板 deploy/nginx-https.conf:
#   1. 替换证书路径 /etc/nginx/ssl/fullchain.pem / privkey.pem
#   2. 替换 server_name your.domain.com
#   3. 80 自动 301 到 443; 443 同端口提供 h2 + HTTP/1.1 ALPN fallback
