# =============================================================================
# GOSpeak 统一部署入口
# =============================================================================
# 用法见 deploy/DEPLOY.md
#
# 常用:
#   # SRS + SQLite 最小生产栈
#   docker compose -f deploy/docker-compose.yml --profile srs --profile app up -d --build
#
#   # LiveKit + SQLite
#   docker compose -f deploy/docker-compose.yml --profile livekit --profile app up -d --build
#
#   # PostgreSQL + SRS + App + Coturn
#   docker compose -f deploy/docker-compose.yml --profile postgres --profile srs --profile app up -d --build
#
# profiles:
#   app       应用镜像 (Go + 前端静态)
#   postgres  PostgreSQL
#   srs       SRS + Nginx 反代
#   livekit   LiveKit
#   rustfs    RustFS
# =============================================================================

name: gospeak

x-restart: &restart
  restart: unless-stopped

services:
  # ── 应用 ──────────────────────────────────────────────────────────────
  gospeak:
    <<: *restart
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
    image: gospeak:latest
    container_name: gospeak-app
    env_file:
      - ${GOSPEAK_ENV_FILE:-./env/app.srs.env}
    environment:
      SERVER_PORT: "8998"
      STATIC_DIR: /app/static
      DB_PATH: ${DB_PATH:-/app/db/app.db}
    ports:
      - "${GOSPEAK_PORT:-8998}:8998"
    volumes:
      - gospeak-db:/app/db
      - gospeak-logs:/app/logs
      - gospeak-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      srs:
        condition: service_started
        required: false
      livekit:
        condition: service_started
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8998/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── NATS（可选，多副本信号总线；单机默认用 gospeak 内嵌）──
  nats:
    <<: *restart
    profiles: ["nats", "cluster"]
    image: nats:2-alpine
    container_name: gospeak-nats
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_HTTP_PORT:-8222}:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  # ── 集群控制面（Agent + Worker）──────────────────────────────────────
  gospeak-agent:
    <<: *restart
    profiles: ["cluster"]
    image: gospeak:latest
    env_file:
      - ${GOSPEAK_ENV_FILE:-./env/app.srs.env}
    environment:
      GOSPEAK_ROLE: agent
      SERVER_PORT: "9000"
      STATIC_DIR: /app/static
      DB_PATH: ${DB_PATH:-/app/db/app.db}
      DB_TYPE: ${DB_TYPE:-PostgresSQL}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-gospeak}
      DB_PASSWORD: ${DB_PASSWORD:-gospeak}
      DB_READ_DSN: ${DB_READ_DSN:-}
      DB_READ_HOST: ${DB_READ_HOST:-}
      DB_READ_PORT: ${DB_READ_PORT:-}
      DB_READ_USER: ${DB_READ_USER:-}
      DB_READ_PASSWORD: ${DB_READ_PASSWORD:-}
      DB_READ_ONLY: ${DB_READ_ONLY:-true}
      DB_REPLICA_LAG_THRESHOLD: ${DB_REPLICA_LAG_THRESHOLD:-5s}
      CLUSTER_ADVERTISE_URL: ${CLUSTER_AGENT_ADVERTISE_URL:-http://gospeak-agent:9000}
      CLUSTER_AGENT_TOKEN: ${CLUSTER_AGENT_TOKEN:-}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      STATE_STORE: ${STATE_STORE:-nats}
    ports:
      - "${GOSPEAK_AGENT_PORT:-9000}:9000"
    volumes:
      - gospeak-db:/app/db
      - gospeak-logs:/app/logs
      - gospeak-uploads:/app/uploads
    depends_on:
      nats:
        condition: service_healthy
        required: false

  gospeak-worker:
    <<: *restart
    profiles: ["cluster"]
    image: gospeak:latest
    env_file:
      - ${GOSPEAK_ENV_FILE:-./env/app.srs.env}
    environment:
      GOSPEAK_ROLE: worker
      SERVER_PORT: "8998"
      STATIC_DIR: /app/static
      DB_PATH: ${DB_PATH:-/app/db/app.db}
      DB_TYPE: ${DB_TYPE:-PostgresSQL}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-gospeak}
      DB_PASSWORD: ${DB_PASSWORD:-gospeak}
      DB_READ_DSN: ${DB_READ_DSN:-}
      DB_READ_HOST: ${DB_READ_HOST:-}
      DB_READ_PORT: ${DB_READ_PORT:-}
      DB_READ_USER: ${DB_READ_USER:-}
      DB_READ_PASSWORD: ${DB_READ_PASSWORD:-}
      DB_READ_ONLY: ${DB_READ_ONLY:-true}
      DB_REPLICA_LAG_THRESHOLD: ${DB_REPLICA_LAG_THRESHOLD:-5s}
      CLUSTER_AGENT_URL: ${CLUSTER_AGENT_URL:-http://gospeak-agent:9000}
      CLUSTER_AGENT_TOKEN: ${CLUSTER_AGENT_TOKEN:-}
      CLUSTER_NODE_ID: ${CLUSTER_WORKER_NODE_ID:-worker-default}
      CLUSTER_NODE_SECRET: ${CLUSTER_NODE_SECRET:-}
      CLUSTER_ADVERTISE_URL: ${CLUSTER_WORKER_ADVERTISE_URL:?CLUSTER_WORKER_ADVERTISE_URL is required for cluster mode}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      STATE_STORE: ${STATE_STORE:-nats}
    ports:
      - "${GOSPEAK_WORKER_PORT:-8998}:8998"
    volumes:
      - gospeak-db:/app/db
      - gospeak-logs:/app/logs
      - gospeak-uploads:/app/uploads
    depends_on:
      gospeak-agent:
        condition: service_started
      nats:
        condition: service_healthy
        required: false

  gospeak-worker-1:
    <<: *restart
    profiles: ["cluster"]
    image: gospeak:latest
    container_name: gospeak-worker-1
    env_file:
      - ${GOSPEAK_ENV_FILE:-./env/app.srs.env}
    environment:
      GOSPEAK_ROLE: worker
      SERVER_PORT: "8998"
      STATIC_DIR: /app/static
      DB_PATH: ${DB_PATH:-/app/db/app.db}
      DB_TYPE: ${DB_TYPE:-PostgresSQL}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-gospeak}
      DB_PASSWORD: ${DB_PASSWORD:-gospeak}
      DB_READ_DSN: ${DB_READ_DSN:-}
      DB_READ_HOST: ${DB_READ_HOST:-}
      DB_READ_PORT: ${DB_READ_PORT:-}
      DB_READ_USER: ${DB_READ_USER:-}
      DB_READ_PASSWORD: ${DB_READ_PASSWORD:-}
      DB_READ_ONLY: ${DB_READ_ONLY:-true}
      DB_REPLICA_LAG_THRESHOLD: ${DB_REPLICA_LAG_THRESHOLD:-5s}
      CLUSTER_AGENT_URL: ${CLUSTER_AGENT_URL:-http://gospeak-agent:9000}
      CLUSTER_AGENT_TOKEN: ${CLUSTER_AGENT_TOKEN:-}
      CLUSTER_NODE_ID: worker-1
      CLUSTER_NODE_SECRET: ${CLUSTER_WORKER1_NODE_SECRET:-${CLUSTER_NODE_SECRET:-}}
      CLUSTER_ADVERTISE_URL: ${CLUSTER_WORKER1_ADVERTISE_URL:?CLUSTER_WORKER1_ADVERTISE_URL is required for cluster mode}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      STATE_STORE: ${STATE_STORE:-nats}
    ports:
      - "${GOSPEAK_WORKER1_PORT:-18998}:8998"
    volumes:
      - gospeak-db:/app/db
      - gospeak-logs:/app/logs
      - gospeak-uploads:/app/uploads
    depends_on:
      gospeak-agent:
        condition: service_started
      nats:
        condition: service_healthy
        required: false

  gospeak-worker-2:
    <<: *restart
    profiles: ["cluster"]
    image: gospeak:latest
    container_name: gospeak-worker-2
    env_file:
      - ${GOSPEAK_ENV_FILE:-./env/app.srs.env}
    environment:
      GOSPEAK_ROLE: worker
      SERVER_PORT: "8998"
      STATIC_DIR: /app/static
      DB_PATH: ${DB_PATH:-/app/db/app.db}
      DB_TYPE: ${DB_TYPE:-PostgresSQL}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-gospeak}
      DB_PASSWORD: ${DB_PASSWORD:-gospeak}
      DB_READ_DSN: ${DB_READ_DSN:-}
      DB_READ_HOST: ${DB_READ_HOST:-}
      DB_READ_PORT: ${DB_READ_PORT:-}
      DB_READ_USER: ${DB_READ_USER:-}
      DB_READ_PASSWORD: ${DB_READ_PASSWORD:-}
      DB_READ_ONLY: ${DB_READ_ONLY:-true}
      DB_REPLICA_LAG_THRESHOLD: ${DB_REPLICA_LAG_THRESHOLD:-5s}
      CLUSTER_AGENT_URL: ${CLUSTER_AGENT_URL:-http://gospeak-agent:9000}
      CLUSTER_AGENT_TOKEN: ${CLUSTER_AGENT_TOKEN:-}
      CLUSTER_NODE_ID: worker-2
      CLUSTER_NODE_SECRET: ${CLUSTER_WORKER2_NODE_SECRET:-${CLUSTER_NODE_SECRET:-}}
      CLUSTER_ADVERTISE_URL: ${CLUSTER_WORKER2_ADVERTISE_URL:?CLUSTER_WORKER2_ADVERTISE_URL is required for cluster mode}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      STATE_STORE: ${STATE_STORE:-nats}
    ports:
      - "${GOSPEAK_WORKER2_PORT:-18999}:8998"
    volumes:
      - gospeak-db:/app/db
      - gospeak-logs:/app/logs
      - gospeak-uploads:/app/uploads
    depends_on:
      gospeak-agent:
        condition: service_started
      nats:
        condition: service_healthy
        required: false

  nginx-cluster:
    <<: *restart
    profiles: ["cluster"]
    image: nginx:alpine
    container_name: gospeak-nginx-cluster
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx-cluster.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gospeak-agent:
        condition: service_started
      gospeak-worker:
        condition: service_started
      gospeak-worker-1:
        condition: service_started
      gospeak-worker-2:
        condition: service_started

  # ── Nginx 入口 (SRS 模式推荐) ─────────────────────────────────────────
  nginx:
    <<: *restart
    profiles: ["srs"]
    image: nginx:alpine
    container_name: gospeak-nginx
    # HTTPS + HTTP/2 模式: 将配置挂载替换为 ./nginx-docker-https.conf,
    # 映射 443 并挂载 ./ssl/fullchain.pem 与 ./ssl/privkey.pem
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx-docker.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      srs:
        condition: service_started
      gospeak:
        condition: service_healthy
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── SRS ───────────────────────────────────────────────────────────────
  srs:
    <<: *restart
    profiles: ["srs"]
    image: ossrs/srs:6
    container_name: gospeak-srs
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
      - "8000:8000/udp"
      - "8000:8000/tcp"
    environment:
      CANDIDATE: "${SRS_CANDIDATE:-127.0.0.1}"
    volumes:
      - ./srs/srs.docker.conf:/usr/local/srs/conf/srs.conf:ro
    command: ./objs/srs -c conf/srs.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── LiveKit ───────────────────────────────────────────────────────────
  livekit:
    <<: *restart
    profiles: ["livekit"]
    image: livekit/livekit-server:latest
    container_name: gospeak-livekit
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882"
      - "7882:7882/udp"
      - "3478:3478/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # MediaSoup worker 已禁用保留：实现/镜像配置仍在，默认不启用。
  # 如需恢复，取消注释并同时恢复 factory/config 注册。
  # mediasoup-worker:
  #   <<: *restart
  #   profiles: ["mediasoup"]
  #   build:
  #     context: ..
  #     dockerfile: deploy/mediasoup-worker/Dockerfile
  #   image: gospeak-mediasoup-worker:latest
  #   container_name: gospeak-mediasoup-worker
  #   ports:
  #     - "3012:3012"
  #     - "40000-40100:40000-40100/udp"
  #   environment:
  #     PORT: 3012
  #     RTC_MIN_PORT: 40000
  #     RTC_MAX_PORT: 40100
  #     LISTEN_IP: 0.0.0.0
  #     ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  # ── PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    <<: *restart
    profiles: ["postgres", "cluster"]
    image: postgres:16-alpine
    container_name: gospeak-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gospeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gospeak}
      POSTGRES_DB: ${POSTGRES_DB:-gospeak}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gospeak}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── RustFS ────────────────────────────────────────────────────────────
  rustfs:
    <<: *restart
    profiles: ["rustfs"]
    image: rustfs/rustfs:1.0.0-beta.1
    container_name: gospeak-rustfs
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台
    environment:
      # ⚠️ 生产环境必须覆盖以下默认值，勿使用 rustfsadmin/rustfsadmin 上线
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data

  # ── Observability (Prometheus / Grafana / Alertmanager / Loki) ───────
  prometheus:
    <<: *restart
    profiles: ["observability"]
    image: prom/prometheus:v3.2.1
    container_name: gospeak-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 6

  alertmanager:
    <<: *restart
    profiles: ["observability"]
    image: prom/alertmanager:v0.28.1
    container_name: gospeak-alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  grafana:
    <<: *restart
    profiles: ["observability"]
    image: grafana/grafana:11.5.2
    container_name: gospeak-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

  loki:
    <<: *restart
    profiles: ["observability"]
    image: grafana/loki:3.4.2
    container_name: gospeak-loki
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"

  promtail:
    <<: *restart
    profiles: ["observability"]
    image: grafana/promtail:3.4.2
    container_name: gospeak-promtail
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started

volumes:
  gospeak-db:
  gospeak-logs:
  gospeak-uploads:
  postgres-data:
  rustfs-data:
  prometheus-data:
  grafana-data:
  loki-data:
