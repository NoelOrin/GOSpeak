# =============================================================================
# GOSpeak 统一部署入口
# =============================================================================
# 用法见 deploy/DEPLOY.md
#
# 常用:
#   # SRS + SQLite 最小生产栈
#   docker compose -f deploy/docker-compose.yml --profile srs --profile app up -d --build
#
#   # LiveKit + Redis + SQLite
#   docker compose -f deploy/docker-compose.yml --profile livekit --profile app up -d --build
#
#   # PostgreSQL + Redis + SRS + App + Coturn
#   docker compose -f deploy/docker-compose.yml --profile postgres --profile redis --profile srs --profile app up -d --build
#
# profiles:
#   app       应用镜像 (Go + 前端静态)
#   postgres  PostgreSQL
#   redis     应用/LiveKit Redis
#   srs       SRS + Nginx 反代
#   livekit   LiveKit
#   minio     MinIO
# =============================================================================

name: gospeak

x-restart: &restart
  restart: unless-stopped

services:
  # ── 应用 ──────────────────────────────────────────────────────────────
  gospeak:
    <<: *restart
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
    image: gospeak:latest
    container_name: gospeak-app
    env_file:
      - ${GOSPEAK_ENV_FILE:-./env/app.srs.env}
    environment:
      SERVER_PORT: "8998"
      STATIC_DIR: /app/static
      DB_PATH: ${DB_PATH:-/app/db/app.db}
    ports:
      - "${GOSPEAK_PORT:-8998}:8998"
    volumes:
      - gospeak-db:/app/db
      - gospeak-logs:/app/logs
      - gospeak-uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
      srs:
        condition: service_started
        required: false
      livekit:
        condition: service_started
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8998/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── NATS（可选，多副本信号总线；单机默认用 gospeak 内嵌）──
  nats:
    <<: *restart
    profiles: ["nats", "cluster"]
    image: nats:2-alpine
    container_name: gospeak-nats
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_HTTP_PORT:-8222}:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  # ── 集群控制面（Agent + Worker）──────────────────────────────────────
  gospeak-agent:
    <<: *restart
    profiles: ["cluster"]
    image: gospeak:latest
    env_file:
      - ${GOSPEAK_ENV_FILE:-./env/app.srs.env}
    environment:
      GOSPEAK_ROLE: agent
      SERVER_PORT: "9000"
      STATIC_DIR: /app/static
      DB_PATH: ${DB_PATH:-/app/db/app.db}
      DB_TYPE: ${DB_TYPE:-PostgresSQL}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-gospeak}
      DB_PASSWORD: ${DB_PASSWORD:-gospeak}
      CLUSTER_ADVERTISE_URL: ${CLUSTER_AGENT_ADVERTISE_URL:-http://gospeak-agent:9000}
      CLUSTER_AGENT_TOKEN: ${CLUSTER_AGENT_TOKEN:-}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      STATE_STORE: ${STATE_STORE:-nats}
    ports:
      - "${GOSPEAK_AGENT_PORT:-9000}:9000"
    volumes:
      - gospeak-db:/app/db
      - gospeak-logs:/app/logs
      - gospeak-uploads:/app/uploads
    depends_on:
      nats:
        condition: service_healthy
        required: false

  gospeak-worker:
    <<: *restart
    profiles: ["cluster"]
    image: gospeak:latest
    env_file:
      - ${GOSPEAK_ENV_FILE:-./env/app.srs.env}
    environment:
      GOSPEAK_ROLE: worker
      SERVER_PORT: "8998"
      STATIC_DIR: /app/static
      DB_PATH: ${DB_PATH:-/app/db/app.db}
      DB_TYPE: ${DB_TYPE:-PostgresSQL}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-gospeak}
      DB_PASSWORD: ${DB_PASSWORD:-gospeak}
      CLUSTER_AGENT_URL: ${CLUSTER_AGENT_URL:-http://gospeak-agent:9000}
      CLUSTER_AGENT_TOKEN: ${CLUSTER_AGENT_TOKEN:-}
      CLUSTER_NODE_ID: ${CLUSTER_WORKER_NODE_ID:-worker-1}
      CLUSTER_ADVERTISE_URL: ${CLUSTER_WORKER_ADVERTISE_URL:?CLUSTER_WORKER_ADVERTISE_URL is required for cluster mode}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      STATE_STORE: ${STATE_STORE:-nats}
    ports:
      - "${GOSPEAK_WORKER_PORT:-8998}:8998"
    volumes:
      - gospeak-db:/app/db
      - gospeak-logs:/app/logs
      - gospeak-uploads:/app/uploads
    depends_on:
      gospeak-agent:
        condition: service_started
      nats:
        condition: service_healthy
        required: false

  nginx-cluster:
    <<: *restart
    profiles: ["cluster"]
    image: nginx:alpine
    container_name: gospeak-nginx-cluster
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx-cluster.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gospeak-agent:
        condition: service_started
      gospeak-worker:
        condition: service_started

  # ── Nginx 入口 (SRS 模式推荐) ─────────────────────────────────────────
  nginx:
    <<: *restart
    profiles: ["srs"]
    image: nginx:alpine
    container_name: gospeak-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx-docker.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      srs:
        condition: service_started
      gospeak:
        condition: service_healthy
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── SRS ───────────────────────────────────────────────────────────────
  srs:
    <<: *restart
    profiles: ["srs"]
    image: ossrs/srs:6
    container_name: gospeak-srs
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
      - "8000:8000/udp"
      - "8000:8000/tcp"
    environment:
      CANDIDATE: "${SRS_CANDIDATE:-127.0.0.1}"
    volumes:
      - ./srs/srs.docker.conf:/usr/local/srs/conf/srs.conf:ro
    command: ./objs/srs -c conf/srs.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── LiveKit ───────────────────────────────────────────────────────────
  livekit:
    <<: *restart
    profiles: ["livekit"]
    image: livekit/livekit-server:latest
    container_name: gospeak-livekit
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882"
      - "7882:7882/udp"
      - "3478:3478/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # MediaSoup worker 已禁用保留：实现/镜像配置仍在，默认不启用。
  # 如需恢复，取消注释并同时恢复 factory/config 注册。
  # mediasoup-worker:
  #   <<: *restart
  #   profiles: ["mediasoup"]
  #   build:
  #     context: ..
  #     dockerfile: deploy/mediasoup-worker/Dockerfile
  #   image: gospeak-mediasoup-worker:latest
  #   container_name: gospeak-mediasoup-worker
  #   ports:
  #     - "3012:3012"
  #     - "40000-40100:40000-40100/udp"
  #   environment:
  #     PORT: 3012
  #     RTC_MIN_PORT: 40000
  #     RTC_MAX_PORT: 40100
  #     LISTEN_IP: 0.0.0.0
  #     ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    <<: *restart
    profiles: ["redis", "livekit", "postgres-redis"]
    image: redis:7-alpine
    container_name: gospeak-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    <<: *restart
    profiles: ["postgres", "postgres-redis", "cluster"]
    image: postgres:16-alpine
    container_name: gospeak-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gospeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gospeak}
      POSTGRES_DB: ${POSTGRES_DB:-gospeak}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gospeak}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MinIO ─────────────────────────────────────────────────────────────
  minio:
    <<: *restart
    profiles: ["minio"]
    image: minio/minio:latest
    container_name: gospeak-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  gospeak-db:
  gospeak-logs:
  gospeak-uploads:
  redis-data:
  postgres-data:
  minio-data:
