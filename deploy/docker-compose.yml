# =============================================================================
# GOSpeak 统一部署入口
# =============================================================================
# 用法见 deploy/DEPLOY.md
#
# 首次部署: ./init.sh  （生成 deploy/.env，含随机密钥）
# 之后所有命令（在 deploy/ 目录下，或任意目录 -f 指到本文件）:
#   docker compose up -d --build     # 启动
#   docker compose logs -f gospeak   # 日志
#   docker compose pull && docker compose up -d   # 升级
#
# 档位由 deploy/.env 的 COMPOSE_PROFILES 控制:
#   app / postgres / livekit / rustfs / observability
# =============================================================================

name: gospeak

x-restart: &restart
  restart: unless-stopped

services:
  # ── 应用 ──────────────────────────────────────────────────────────────
  # 默认本地构建；也可直接用 release tag 发布的 GHCR 镜像（免构建）：
  #   GOSPEAK_IMAGE=ghcr.io/<owner>/gospeak:latest  # 或具体版本如 :1.2.3
  gospeak:
    <<: *restart
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${GOSPEAK_IMAGE:-gospeak:latest}
    pull_policy: ${GOSPEAK_PULL_POLICY:-missing}
    container_name: gospeak-app
    # 唯一配置来源: deploy/.env（compose 插值与应用 env 共用）
    env_file:
      - .env
    environment:
      SERVER_PORT: "8998"
      STATIC_DIR: /app/static
      DB_PATH: ${DB_PATH:-/app/db/app.db}
    ports:
      - "${GOSPEAK_PORT:-8998}:8998"
    volumes:
      - gospeak-db:/app/db
      - gospeak-logs:/app/logs
      - gospeak-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      livekit:
        condition: service_started
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8998/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── LiveKit ───────────────────────────────────────────────────────────
  livekit:
    <<: *restart
    profiles: ["livekit"]
    image: livekit/livekit-server:latest
    container_name: gospeak-livekit
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882"
      - "7882:7882/udp"
      - "3478:3478/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
  postgres:
    <<: *restart
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: gospeak-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gospeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gospeak}
      POSTGRES_DB: ${POSTGRES_DB:-gospeak}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gospeak}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── RustFS ────────────────────────────────────────────────────────────
  rustfs:
    <<: *restart
    profiles: ["rustfs"]
    image: rustfs/rustfs:1.0.0-beta.1
    container_name: gospeak-rustfs
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台
    environment:
      # ⚠️ 生产环境必须覆盖以下默认值，勿使用 rustfsadmin/rustfsadmin 上线
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data

  # ── Observability (Prometheus / Grafana / Alertmanager / Loki) ───────
  prometheus:
    <<: *restart
    profiles: ["observability"]
    image: prom/prometheus:v3.2.1
    container_name: gospeak-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 6

  alertmanager:
    <<: *restart
    profiles: ["observability"]
    image: prom/alertmanager:v0.28.1
    container_name: gospeak-alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  grafana:
    <<: *restart
    profiles: ["observability"]
    image: grafana/grafana:11.5.2
    container_name: gospeak-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

  loki:
    <<: *restart
    profiles: ["observability"]
    image: grafana/loki:3.4.2
    container_name: gospeak-loki
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"

  promtail:
    <<: *restart
    profiles: ["observability"]
    image: grafana/promtail:3.4.2
    container_name: gospeak-promtail
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started

volumes:
  gospeak-db:
  gospeak-logs:
  gospeak-uploads:
  postgres-data:
  rustfs-data:
  prometheus-data:
  grafana-data:
  loki-data:
