# =============================================================================
# GOSpeak 统一部署入口
# =============================================================================
# 用法见 deploy/DEPLOY.md
#
# 首次部署: ./init.sh  （生成 deploy/.env，含随机密钥）
# 之后所有命令（在 deploy/ 目录下，或任意目录 -f 指到本文件）:
#   docker compose up -d --build     # 启动
#   docker compose logs -f gospeak   # 日志
#   docker compose pull && docker compose up -d   # 升级
#
# 档位由 deploy/.env 的 COMPOSE_PROFILES 控制:
#   app / livekit / edge / postgres / rustfs / observability
#   edge = 内置 Caddy 入口（自动 HTTPS）。有域名时开启；已有反代则不要开。
#   默认组合 app,livekit 已能跑通语音，无需额外服务。
# =============================================================================

name: gospeak

x-restart: &restart
  restart: unless-stopped

services:
  # ── 应用 ──────────────────────────────────────────────────────────────
  # 默认本地构建；也可直接用 release tag 发布的 GHCR 镜像（免构建）：
  #   GOSPEAK_IMAGE=ghcr.io/noelorin/gospeak:latest  # 或具体版本如 :1.2.3
  gospeak:
    <<: *restart
    profiles: ["app"]
    # 默认使用 GHCR 发布镜像（免构建）；要本地构建时在 .env 设
    # GOSPEAK_IMAGE=gospeak:local 并执行：
    #   docker build --build-arg VERSION=$(cat VERSION) --build-arg COMMIT=$(git rev-parse --short HEAD) -t gospeak:local .
    # （不注入 buildinfo.Version/Commit 时镜像内恒为 dev/unknown，更新检查永远报不出新版本）
    image: ${GOSPEAK_IMAGE:-ghcr.io/noelorin/gospeak:latest}
    pull_policy: ${GOSPEAK_PULL_POLICY:-missing}
    container_name: gospeak-app
    # 唯一配置来源: deploy/.env（compose 插值与应用 env 共用）
    env_file:
      - .env
    environment:
      SERVER_PORT: "8998"
      STATIC_DIR: /app/static
      DB_PATH: ${DB_PATH:-/app/db/app.db}
      # 前置 Caddy / 自有反代后，应用看到的客户端 IP 是代理的内网地址。
      # 信任 Docker 私网段才能从 X-Forwarded-For 取回真实 IP（限流/审计依赖它）；
      # 直接对外暴露时客户端是公网 IP，不会命中这段，因此默认值安全。
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      # 内嵌 NATS JetStream 数据目录（JWT 签名密钥/黑名单/refresh-family）。
      # 固定路径 + 独立卷，确保容器重建后 KV 不丢；镜像内已设为默认值，此处显式声明便于覆盖。
      NATS_STORE_DIR: ${NATS_STORE_DIR:-/app/nats}
    ports:
      - "${GOSPEAK_PORT:-8998}:8998"
    volumes:
      - gospeak-db:/app/db
      - gospeak-logs:/app/logs
      - gospeak-uploads:/app/uploads
      - gospeak-nats:/app/nats
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      livekit:
        condition: service_started
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8998/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── LiveKit ───────────────────────────────────────────────────────────
  livekit:
    <<: *restart
    profiles: ["livekit"]
    image: livekit/livekit-server:latest
    container_name: gospeak-livekit
    ports:
      # 不再对公网发布 7880（信令）与 7881（RTC over TCP/TLS）：
      # 浏览器经应用同源反代 /livekit 接入，LiveKit 不需要域名/证书。
      # 7880 只绑本机回环，供宿主机 `pnpm dev` 直连容器内 LiveKit 调试用，
      # 不暴露到公网，因此不增加任何对外攻击面。
      - "127.0.0.1:7880:7880"
      - "7882:7882"        # RTC over TCP（UDP 不通时的兜底）
      - "7882:7882/udp"    # RTC over UDP（媒体主通道）
      - "3478:3478/udp"    # TURN
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      # 密钥只从 deploy/.env 注入，livekit.yaml 里不含任何凭据。
      # LIVEKIT_KEYS 覆盖 keys，LIVEKIT_WEBHOOK_API_KEY 覆盖 webhook 签名 key
      # （LiveKit 1.13 起必填，否则启动报 "api_key is required to use webhooks"）。
      LIVEKIT_KEYS: "${LIVEKIT_KEY}: ${LIVEKIT_SECRET}"
      LIVEKIT_WEBHOOK_API_KEY: "${LIVEKIT_KEY}"
    command: --config /etc/livekit.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Caddy 边缘入口（profile edge，可选）─────────────────────────────────
  # 唯一上游就是 gospeak:8998：/api、/ws、/uploads、/livekit 全在里面，
  # 所以不需要为 LiveKit 单独配置域名、证书或反代规则。
  # GOSPEAK_DOMAIN 留空时 Caddyfile 站点地址退化为 :80（局域网/已有反代）。
  caddy:
    <<: *restart
    profiles: ["edge"]
    image: caddy:2-alpine
    container_name: gospeak-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      GOSPEAK_DOMAIN: ${GOSPEAK_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gospeak:
        condition: service_started
        required: false

  postgres:
    <<: *restart
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: gospeak-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gospeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gospeak}
      POSTGRES_DB: ${POSTGRES_DB:-gospeak}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gospeak}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── RustFS ────────────────────────────────────────────────────────────
  rustfs:
    <<: *restart
    profiles: ["rustfs"]
    image: rustfs/rustfs:1.0.0-beta.1
    container_name: gospeak-rustfs
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台
    environment:
      # ⚠️ 生产环境必须覆盖以下默认值，勿使用 rustfsadmin/rustfsadmin 上线
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data

  # ── Observability (Prometheus / Grafana / Alertmanager / Loki) ───────
  prometheus:
    <<: *restart
    profiles: ["observability"]
    image: prom/prometheus:v3.2.1
    container_name: gospeak-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 6

  alertmanager:
    <<: *restart
    profiles: ["observability"]
    image: prom/alertmanager:v0.28.1
    container_name: gospeak-alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  grafana:
    <<: *restart
    profiles: ["observability"]
    image: grafana/grafana:11.5.2
    container_name: gospeak-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

  loki:
    <<: *restart
    profiles: ["observability"]
    image: grafana/loki:3.4.2
    container_name: gospeak-loki
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"

  promtail:
    <<: *restart
    profiles: ["observability"]
    image: grafana/promtail:3.4.2
    container_name: gospeak-promtail
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started

volumes:
  gospeak-db:
  gospeak-logs:
  gospeak-uploads:
  gospeak-nats:
  caddy-data:
  caddy-config:
  postgres-data:
  rustfs-data:
  prometheus-data:
  grafana-data:
  loki-data:
