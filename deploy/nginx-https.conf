# GOSpeak Nginx 反向代理配置 - HTTPS + HTTP/2
# 用法: 宿主 nginx 引用本文件, 或替换 deploy/nginx.conf。
# 证书路径按实际部署修改; 启用后同端口自动提供 h2 + HTTP/1.1 ALPN fallback。
#
# 拓扑:
#   client → nginx(443 h2/http1.1) → Go 后端 :8998 (/ + /api + /ws + /static)
#   client → nginx(443 h2/http1.1) → SRS :1985 (/rtc/v1/whip + /rtc/v1/whep)
#   client → SRS :8000/udp (WebRTC media, 直连)

upstream gospeak_backend {
    server 127.0.0.1:8998;
    keepalive 32;
}

upstream gospeak_srs_http_api {
    server 127.0.0.1:1985;
    keepalive 16;
}

# WebSocket upgrade map (必需, /ws)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name your.domain.com;
    return 301 https://$host$request_uri;
}

server {
    # Nginx >= 1.25.1 可改用新语法: listen 443 ssl; http2 on;
    listen 443 ssl http2;
    server_name your.domain.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20m;

    # ── 健康检查直通 ───────────────────────────────────────────
    location = /ping {
        proxy_pass http://gospeak_backend;
        access_log off;
    }

    # ── WebSocket 信令 (WebSocket) ─────────────────────────────
    # WebSocket 走 HTTP/1.1 Upgrade, 与页面 h2 并存
    location /ws {
        proxy_pass http://gospeak_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # ── API 反向代理 ───────────────────────────────────────────
    location /api/ {
        proxy_pass http://gospeak_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
    }

    # ── SRS WHIP/WHEP 反向代理 ───────────────────────────────
    location /rtc/v1/ {
        proxy_pass http://gospeak_srs_http_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ── Swagger UI ─────────────────────────────────────────────
    location /swagger/ {
        proxy_pass http://gospeak_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── 静态资源缓存 (前端 SPA, Go 托管) ───────────────────────
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|ico|webp)$ {
        proxy_pass http://gospeak_backend;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # ── SPA 入口 (兜底, 前端路由交给 index.html) ───────────────
    location / {
        proxy_pass http://gospeak_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
