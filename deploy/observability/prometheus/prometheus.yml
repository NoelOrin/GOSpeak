global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: gospeak

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: gospeak
    metrics_path: /metrics
    static_configs:
      - targets:
          - gospeak:8998
          - gospeak-agent:9000
          - gospeak-worker:8998
          - gospeak-worker-1:8998
          - gospeak-worker-2:8998
