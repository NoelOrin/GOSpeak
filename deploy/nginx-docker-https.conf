events {
    worker_connections 1024;
}

# GOSpeak Nginx - Docker Compose (HTTPS + HTTP/2)
# 用法: 将 docker-compose.yml 中 nginx 服务的挂载替换为本文件,
# 映射 443 并挂载证书; 同端口自动提供 h2 + HTTP/1.1 ALPN fallback。
# 证书路径: ./ssl/fullchain.pem / ./ssl/privkey.pem

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream gospeak_backend {
        server gospeak:8998;
        keepalive 32;
    }

    upstream gospeak_srs_http_api {
        server srs:1985;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name your.domain.com;
        return 301 https://$host$request_uri;
    }

    server {
        # Nginx >= 1.25.1 可改用新语法: listen 443 ssl; http2 on;
        listen 443 ssl http2;
        server_name your.domain.com;
        client_max_body_size 20m;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;

        location = /ping {
            proxy_pass http://gospeak_backend;
            access_log off;
        }

        location /ws {
            proxy_pass http://gospeak_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /api/ {
            proxy_pass http://gospeak_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /rtc/v1/ {
            proxy_pass http://gospeak_srs_http_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /srs-api/ {
            proxy_pass http://gospeak_srs_http_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /swagger/ {
            proxy_pass http://gospeak_backend;
            proxy_set_header Host $host;
            access_log off;
        }

        location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|ico|webp)$ {
            proxy_pass http://gospeak_backend;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=604800, immutable";
            access_log off;
        }

        location / {
            proxy_pass http://gospeak_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
