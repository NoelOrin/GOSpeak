events {
    worker_connections 1024;
}

# GOSpeak Nginx 反向代理配置 — Docker Compose 专用
# 与 deploy/nginx.conf 同步, 仅 upstream 地址不同
# Docker DNS 使用服务名(srs, gospeak-backend 等)作 hostname
#
# 拓扑:
#   client → nginx(80) → SRS :1985 (/rtc/v1 WHIP/WHEP)
#   client → SRS :8000/udp (WebRTC media, 直连)
#   client → nginx(80) → Go 后端 :8998 (/ + /api + /socket.io + /static)

# WebRTC 媒体口 8000/udp 由 SRS 容器直暴露，不经 nginx stream（stream 改写源地址会让 ICE 失败）

# ── HTTP 反向代理 ──────────────────────────────────────────────────
http {
    upstream gospeak_backend {
        server host.docker.internal:8998;
        keepalive 32;
    }

    upstream gospeak_srs_http_api {
        server srs:1985;
        keepalive 16;
    }

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        location = /ping {
            proxy_pass http://gospeak_backend;
            access_log off;
        }

        location /socket.io/ {
            proxy_pass http://gospeak_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
        }

        location /api/ {
            proxy_pass http://gospeak_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  60s;
        }

        location /rtc/v1/ {
            proxy_pass http://gospeak_srs_http_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout  120s;
            proxy_send_timeout  120s;
        }

        location /swagger/ {
            proxy_pass http://gospeak_backend;
            proxy_set_header Host $host;
            access_log off;
        }

        location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|ico|webp)$ {
            proxy_pass http://gospeak_backend;
            proxy_set_header Host $host;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            access_log off;
        }

        location / {
            proxy_pass http://gospeak_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
