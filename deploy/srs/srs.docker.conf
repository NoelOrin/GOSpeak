# SRS6 for full docker-compose stack (callback -> gospeak service)
listen              1935;
max_connections     1000;
daemon              off;

http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}

http_api {
    enabled on;
    listen 1985;
    crossdomain on;
}

rtc_server {
    enabled on;
    listen 8000;
    tcp {
        enabled on;
        listen 8000;
    }
    protocol all;
    candidate $CANDIDATE;
}

vhost __defaultVhost__ {
    rtc {
        enabled on;
        nack on;
        twcc on;
    }

    http_hooks {
        enabled         on;
        on_publish      http://gospeak:8998/api/v1/srs/callback;
        on_unpublish    http://gospeak:8998/api/v1/srs/callback;
        on_play         http://gospeak:8998/api/v1/srs/callback;
        on_stop         http://gospeak:8998/api/v1/srs/callback;
    }
}
