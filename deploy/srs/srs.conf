# SRS6 configuration for GOSpeak

listen              1935;
max_connections     1000;
daemon              off;

http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}

http_api {
    enabled on;
    listen 1985;
    crossdomain on;
}

rtc_server {
    enabled on;
    listen 8000;
    # Docker Desktop(macOS) 上 UDP 端口映射会抖源端口，STUN 过了 DTLS 常 hang。
    # 开 TCP candidate 作稳定回退；protocol=all 优先谁先 DTLS 完成用谁。
    tcp {
        enabled on;
        listen 8000;
    }
    protocol all;
    candidate $CANDIDATE;
}

vhost __defaultVhost__ {
    rtc {
        enabled on;
        nack on;
        twcc on;
    }

    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:8998/api/v1/srs/callback;
        on_unpublish    http://host.docker.internal:8998/api/v1/srs/callback;
        on_play         http://host.docker.internal:8998/api/v1/srs/callback;
        on_stop         http://host.docker.internal:8998/api/v1/srs/callback;
    }
}
