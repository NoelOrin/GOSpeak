# SRS5 configuration for GOSpeak

listen              1935;
max_connections     1000;
daemon              off;

http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}

http_api {
    enabled on;
    listen 1985;
    crossdomain on;
}

rtc_server {
    enabled on;
    listen 1985;
    candidate *;
}

vhost __defaultVhost__ {
    rtc {
        enabled on;
        nack on;
        twcc on;
    }
}
