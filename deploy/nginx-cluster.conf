# GOSpeak cluster nginx: single-worker mode only.
# /ws is hard-wired to gospeak-worker:8998. Do NOT reuse this file as a
# multi-worker load balancer: with multiple replicas every websocket hits
# worker-1 while other workers never receive signal traffic.
# Multi-worker deployment options:
#   1. Let the browser connect directly to each worker via
#      CLUSTER_WORKER_ADVERTISE_URL (recommended).
#   2. Add per-worker upstreams/routes and route /ws by worker id.
events {}

http {
  upstream gospeak_agent {
    server gospeak-agent:9000;
  }
  upstream gospeak_worker {
    server gospeak-worker:8998;
  }

  server {
    listen 80;

    location /api/v1/cluster/ {
      proxy_pass http://gospeak_agent;
    }
    # Single worker only: this location always targets gospeak-worker.
    # Multi-worker setups must NOT reuse this block unchanged.
    location /ws {
      proxy_pass http://gospeak_worker;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
    location / {
      proxy_pass http://gospeak_agent;
    }
  }
}
