# GOSpeak cluster nginx: multi-worker entry with application-level sticky routing.
# /ws?worker=<node-id> is routed to the matching worker by the Agent-issued
# workerUrl. Unknown worker ids fall back to the default worker.
# Do not use round-robin for /ws: room state lives on the worker assigned by
# the Agent for the domain, so all room members must reach the same node.
events {}

http {
  map $arg_worker $worker_upstream {
    default   gospeak_worker_default;
    worker-1  gospeak_worker_1;
    worker-2  gospeak_worker_2;
  }

  upstream gospeak_agent {
    server gospeak-agent:9000;
  }
  upstream gospeak_worker_default {
    server gospeak-worker:8998;
  }
  upstream gospeak_worker_1 {
    server gospeak-worker-1:8998;
  }
  upstream gospeak_worker_2 {
    server gospeak-worker-2:8998;
  }

  server {
    listen 80;

    location /api/v1/cluster/ {
      proxy_pass http://gospeak_agent;
    }
    # Unified entry for WebSocket signaling. Agent returns
    # /ws?worker=<node-id> so the same domain stays on one worker.
    location /ws {
      proxy_pass http://$worker_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
      proxy_pass http://gospeak_agent;
    }
  }
}
