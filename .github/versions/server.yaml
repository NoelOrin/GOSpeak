# GOSpeak 服务端（server + web）发布版本 —— 显式声明，CI 的单一事实来源。
#
# 发版流程：修改本文件的 version 并合入 release 后，version-bump.yml 会自动打上
# `gospeak-server-v<version>` tag，release.yml / docker.yml 随之构建发布。
#
# 命名规范（scripts/release-naming.mjs）：
#   tag      gospeak-server-v<version>
#   二进制   gospeak-server-v<version>-<os>-<arch>[.exe]
#   校验和   SHA256SUMS-gospeak-server-v<version>.txt
#
# 同步约束（release.yml 的 version-check 会校验）：根 VERSION 与根 package.json
# 的 version 必须与本文件一致。
version: "1.0.2"

# 本次发版说明：优先作为 GitHub Release 的 release notes（块标量 | 多行）。
# 留空时由 scripts/build-changelog.mjs 按 conventional commits 生成，
# 基线只取本组件的历史 tag。
notes: |
  GOSpeak 1.0.2 —— 事件协议单一来源、架构清理与命名约定统一。

  ## 新增
  - WS 事件协议单一事实源：internal/protocol 统一声明事件名/方向/ACK/payload，
    生成器产出前端类型，内存比对 + pre-push + CI 三道防线防漂移
  - WS payload 全量结构化（房间/成员/消息/私聊/公告/内部事件），字段统一 snake_case
  - 新增简化版 docker compose（app + LiveKit 单机部署）
  - 文档全量对齐：权限种子、事件表、API 参考、配置变量

  ## 修复
  - 私聊推送 payload 双重序列化导致前端收不到对象的缺陷
  - 列表类 API 响应缺字段时前端兜底默认值，不再白屏
  - 集成测试稳定性：SQLite 并发写竞态（WAL）与权限断言修正

  ## 重构（无行为变更）
  - 架构清理：鉴权读取统一 accessor、SFU 能力收敛主接口、
    service→signal 事件化、死流索引子系统删除、Unit-of-Work 消除 gorm 直穿、
    Set 后置装配收敛为构造参数
  - 数据兼容路径全量退役（明文密码迁移/legacy KV 映射/JTI 兜底/Identity 假字段）
