# GOSpeak 服务端（server + web）发布版本 —— 显式声明，CI 的单一事实来源。
#
# 发版流程：修改本文件的 version 并合入 release 后，version-bump.yml 会自动打上
# `gospeak-server-v<version>` tag，release.yml / docker.yml 随之构建发布。
#
# 命名规范（scripts/release-naming.mjs）：
#   tag      gospeak-server-v<version>
#   二进制   gospeak-server-v<version>-<os>-<arch>[.exe]
#   校验和   SHA256SUMS-gospeak-server-v<version>.txt
#
# 同步约束（release.yml 的 version-check 会校验）：根 VERSION 与根 package.json
# 的 version 必须与本文件一致。
version: "1.0.1"

# 本次发版说明：优先作为 GitHub Release 的 release notes（块标量 | 多行）。
# 留空时由 scripts/build-changelog.mjs 按 conventional commits 生成，
# 基线只取本组件的历史 tag。
notes: |
  GOSpeak 1.0.1 —— 桌面覆盖层原生渲染、加载骨架屏与安全加固。

  ## 新增
  - 游戏内覆盖层改用 mygo 原生 Panel 渲染，按显示器分辨率自适应缩放，
    显示策略改为「离开 GOSpeak 时显示」，支持始终显示与手动模式
  - 统一加载骨架屏体系：Skeleton 原语 + LoadingRegion/SkeletonListRows 组合件，
    覆盖消息、会话、域列表、成员、邀请、监控指标卡等主要加载态
  - 工作区文字频道面板重构：全屏视图、会话内搜索、输入区交互改进

  ## 修复
  - WS 策略守卫改为 fail-closed，并在断连前投递 ACK，避免静默丢消息
  - 内嵌 NATS 初始化传入持久化 StoreDir，重启不再丢失 JWT 密钥与 Token 黑名单
  - 服务端更新检查对限流结果做负缓存，版本说明按 rune 截断
  - 加固桌面端回环代理：限制 worker 主机、阻断 cookie 泄漏
  - 校验服务器 URL、限制调试自动退出、修正更新版本比较
  - 稳定覆盖层接力的启动与生命周期，避免启动期 unhandled rejection
  - 分享链接入口并入发现页，移除侧栏重复入口
