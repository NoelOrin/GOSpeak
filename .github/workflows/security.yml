name: Security

on:
  pull_request:
    branches: [release, dev, main, master]
    paths:
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "app/server/go.mod"
      - "app/server/go.sum"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  push:
    branches: [release, dev]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  pnpm-audit:
    name: pnpm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-install
      - name: Audit production dependencies
        env:
          npm_config_registry: https://registry.npmjs.org
        run: pnpm audit --prod --audit-level=critical

  go-vulncheck:
    name: Go Vulnerability Check (Baseline)
    # Existing Go 1.26.2 / dependency findings are reported without blocking until remediated.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true
      - name: Run govulncheck
        working-directory: app/server
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
