name: Security

on:
  pull_request:
    branches: [release, dev]
    paths:
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "app/server/go.mod"
      - "app/server/go.sum"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
  push:
    branches: [release, dev]
    paths:
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "app/server/go.mod"
      - "app/server/go.sum"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    # 仓库未启用 Dependency graph 时该 action 必然报 "not supported"，
    # 与代码无关却让每个依赖 PR 变红。用 API 探测后再决定是否运行。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check dependency graph availability
        id: graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dependency graph disabled, skipping dependency review"
          fi
      - uses: actions/dependency-review-action@v4
        if: steps.graph.outputs.enabled == 'true'
        with:
          fail-on-severity: moderate

  pnpm-audit:
    name: pnpm Audit
    # 报告模式（与 govulncheck 一致）：上游每周都会有新 advisory 披露，硬阻断会让
    # 所有历史 PR / 定时任务一起变红，且失败原因与本次改动无关。
    # 结果写入 Job Summary 存档，解禁时把 continue-on-error 去掉即可。
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install
        with:
          install: false
      - name: Audit production dependencies
        env:
          npm_config_registry: https://registry.npmjs.org
        run: |
          set +e
          pnpm audit --prod --audit-level=critical 2>&1 | tee "$RUNNER_TEMP/audit-report.txt"
          status=${PIPESTATUS[0]}
          {
            echo "## pnpm audit (prod, critical)"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/audit-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  go-vulncheck:
    name: Go Vulnerability Check (Baseline)
    # Existing Go 1.26.2 / dependency findings are reported without blocking until remediated.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true
      - name: Run govulncheck
        working-directory: app/server
        env:
          # 固定版本：@latest 会让门禁结果随上游发版无声变化，无法复现历史结论。
          GOVULNCHECK_VERSION: v1.1.4
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
