name: Security

on:
  pull_request:
    branches: [release, dev, main, master]
    paths:
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "app/server/go.mod"
      - "app/server/go.sum"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
  push:
    branches: [release, dev]
    paths:
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "app/server/go.mod"
      - "app/server/go.sum"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  pnpm-audit:
    name: pnpm Audit
    # 报告模式（与 govulncheck 一致）：上游每周都会有新 advisory 披露，硬阻断会让
    # 所有历史 PR / 定时任务一起变红，且失败原因与本次改动无关。
    # 结果写入 Job Summary 存档，解禁时把 continue-on-error 去掉即可。
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install
        with:
          install: false
      - name: Audit production dependencies
        env:
          npm_config_registry: https://registry.npmjs.org
        run: |
          set +e
          pnpm audit --prod --audit-level=critical 2>&1 | tee "$RUNNER_TEMP/audit-report.txt"
          status=${PIPESTATUS[0]}
          {
            echo "## pnpm audit (prod, critical)"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/audit-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  go-vulncheck:
    name: Go Vulnerability Check (Baseline)
    # Existing Go 1.26.2 / dependency findings are reported without blocking until remediated.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true
      - name: Run govulncheck
        working-directory: app/server
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
