# GOSpeak Version Bump —— push 触发的发版守门员 + 发布编排。
#
# 版本号在 .github/versions/server.yaml 与 .github/versions/desktop.yaml 中
# 显式声明。**每次 push 到 release 都会触发本 workflow**，但对每个组件判断
# 「声明的版本号是否已经发布过」：
#
#   当前声明版本对应的 tag（gospeak-server-v<version> /
#   gospeak-desktop-v<version>）已存在
#     → 版本号没变 → 本 workflow 成功结束并标记 skipped，不创建任何 tag；
#   任一 tag 不存在（新版本号 / 版本回退到未发布过的值）
#     → 打 tag → 直接 workflow_call 调用 release.yml 执行发布。
#
# 为什么要显式调用：GitHub 会抑制由 GITHUB_TOKEN 推送所派生的 workflow
# （防递归）。只推 tag 的话，release.yml 的 on.push.tags 根本不会触发，
# 发布得靠人工 dispatch 补跑。workflow_call 是 job 级调用，不受该限制，
# 也不需要额外的 PAT。
#
# tag 名字一律由 scripts/release-naming.mjs 派生，本文件不手拼字符串。
#
# 也可 workflow_dispatch 手动触发一次对账（只补缺失的 tag，不覆盖已有）。

name: Version Bump

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-tags:
    name: Release declared versions (skip unchanged)
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.gate.outputs.released }}
      server_tag: ${{ steps.gate.outputs.server_tag }}
      desktop_tag: ${{ steps.gate.outputs.desktop_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        # git tag -a 会创建 annotated tag，必须有 committer 身份；
        # runner 默认没有配置，缺失时会以 "empty ident name" 直接失败。
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read declared versions
        id: versions
        run: |
          set -euo pipefail
          read_version() {
            node -e '
              const { readFileSync } = require("node:fs");
              const src = readFileSync(process.argv[1], "utf8");
              const m = src.match(/^version:[ \t]*["'"'"']?([^\s#"'"'"']+)["'"'"']?[ \t]*(?:#.*)?$/m);
              if (!m) { console.error("missing version in " + process.argv[1]); process.exit(1); }
              console.log(m[1]);
            ' "$1"
          }
          {
            echo "server=$(read_version .github/versions/server.yaml)"
            echo "desktop=$(read_version .github/versions/desktop.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Detect published tags
        id: tags
        env:
          SERVER_VERSION: ${{ steps.versions.outputs.server }}
          DESKTOP_VERSION: ${{ steps.versions.outputs.desktop }}
        run: |
          set -euo pipefail
          # 一次性探测两个组件的 tag 是否已存在于远程，避免逐个 ls-remote。
          git ls-remote --tags origin > "$RUNNER_TEMP/remote-tags.txt"

          check() {
            local component="$1" version="$2"
            local tag
            tag="$(node scripts/release-naming.mjs tag "$component" "$version")"
            if grep -qE "refs/tags/${tag}(\^\{\})?$" "$RUNNER_TEMP/remote-tags.txt"; then
              echo "${component}_exists=true" >> "$GITHUB_OUTPUT"
              echo "::notice::${component} ${version} 已发布（tag ${tag} 存在），跳过。"
            else
              echo "${component}_exists=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${component} ${version} 尚未发布，将创建 tag ${tag}。"
            fi
          }

          check server "$SERVER_VERSION"
          check desktop "$DESKTOP_VERSION"

      - name: Decide whether to publish
        id: gate
        env:
          SERVER_VERSION: ${{ steps.versions.outputs.server }}
          SERVER_EXISTS: ${{ steps.tags.outputs.server_exists }}
          DESKTOP_VERSION: ${{ steps.versions.outputs.desktop }}
          DESKTOP_EXISTS: ${{ steps.tags.outputs.desktop_exists }}
        run: |
          set -euo pipefail
          # 同步发版：任一组件的声明版本未发布，则两个组件一起发。
          # 未发布的组件输出对应 tag（缺省为空），发布编排按 tag 逐一调用。
          if [ "$SERVER_EXISTS" = "false" ] || [ "$DESKTOP_EXISTS" = "false" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice::两个组件版本均未变化，本次不发布"
          fi
          if [ "$SERVER_EXISTS" = "false" ]; then
            echo "server_tag=$(node scripts/release-naming.mjs tag server "$SERVER_VERSION")" >> "$GITHUB_OUTPUT"
            echo "::notice::服务端 ${SERVER_VERSION} 将随本次同步发布"
          else
            echo "server_tag=" >> "$GITHUB_OUTPUT"
          fi
          if [ "$DESKTOP_EXISTS" = "false" ]; then
            echo "desktop_tag=$(node scripts/release-naming.mjs tag desktop "$DESKTOP_VERSION")" >> "$GITHUB_OUTPUT"
            echo "::notice::桌面端 ${DESKTOP_VERSION} 将随本次同步发布"
          else
            echo "desktop_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag server release if version changed
        if: steps.tags.outputs.server_exists == 'false'
        env:
          VERSION: ${{ steps.versions.outputs.server }}
        run: |
          set -euo pipefail
          tag="$(node scripts/release-naming.mjs tag server "$VERSION")"
          sha="$(git rev-parse HEAD)"
          git tag -a "$tag" -m "Release ${tag} (declared in .github/versions/server.yaml)" "$sha"
          git push origin "refs/tags/${tag}"
          echo "::notice::created tag ${tag} at ${sha}"

      - name: Tag desktop release if version changed
        if: steps.tags.outputs.desktop_exists == 'false'
        env:
          VERSION: ${{ steps.versions.outputs.desktop }}
        run: |
          set -euo pipefail
          tag="$(node scripts/release-naming.mjs tag desktop "$VERSION")"
          sha="$(git rev-parse HEAD)"
          git tag -a "$tag" -m "Release ${tag} (declared in .github/versions/desktop.yaml)" "$sha"
          git push origin "refs/tags/${tag}"
          echo "::notice::created tag ${tag} at ${sha}"

      - name: Summary
        env:
          SERVER_VERSION: ${{ steps.versions.outputs.server }}
          SERVER_EXISTS: ${{ steps.tags.outputs.server_exists }}
          DESKTOP_VERSION: ${{ steps.versions.outputs.desktop }}
          DESKTOP_EXISTS: ${{ steps.tags.outputs.desktop_exists }}
        run: |
          set -euo pipefail
          status() {
            if [ "$1" = "true" ]; then
              echo "skipped（版本未更新，已发布过）"
            else
              echo "released（已打 tag 触发发布）"
            fi
          }
          server_tag="$(node scripts/release-naming.mjs tag server "$SERVER_VERSION")"
          desktop_tag="$(node scripts/release-naming.mjs tag desktop "$DESKTOP_VERSION")"
          {
            echo "## Version Bump"
            echo ""
            echo "| 组件 | 声明版本 | tag | 结果 |"
            echo "| --- | --- | --- | --- |"
            echo "| 服务端 (server) | ${SERVER_VERSION} | \`${server_tag}\` | $(status "${SERVER_EXISTS}") |"
            echo "| 桌面端 (desktop) | ${DESKTOP_VERSION} | \`${desktop_tag}\` | $(status "${DESKTOP_EXISTS}") |"
            echo ""
            if [ "${SERVER_EXISTS}" = "true" ] && [ "${DESKTOP_EXISTS}" = "true" ]; then
              echo "两个组件版本号均未变化，本次未触发任何发布。"
              echo "如需发版，请修改 \`.github/versions/*.yaml\` 的 version 后合入 release。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 发布编排 ────────────────────────────────────────────────────────────
  # 直接调用 release.yml / docker.yml，而不是等 tag push 派生 workflow ——
  # GITHUB_TOKEN 推送的 tag 不会触发 downstream workflow（docker.yml 的
  # on: push: tags 对 bot tag 永远不触发，镜像发布必须在这里显式调用）。
  release-server:
    name: Publish server release
    needs: [bump-tags]
    if: needs.bump-tags.outputs.released == 'true' && needs.bump-tags.outputs.server_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump-tags.outputs.server_tag }}

  release-desktop:
    name: Publish desktop release
    needs: [bump-tags]
    if: needs.bump-tags.outputs.released == 'true' && needs.bump-tags.outputs.desktop_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump-tags.outputs.desktop_tag }}

  docker:
    name: Publish image
    needs: [bump-tags]
    if: needs.bump-tags.outputs.released == 'true' && needs.bump-tags.outputs.server_tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      release_tag: ${{ needs.bump-tags.outputs.server_tag }}

