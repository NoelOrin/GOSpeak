# GOSpeak Version Bump —— push 触发的发版守门员 + 发布编排。
#
# 版本号在 .github/versions/server.yaml 与 .github/versions/desktop.yaml 中
# 显式声明。**每次 push 到 release 都会触发本 workflow**，但对每个组件判断
# 「声明的版本号是否已经发布过」：
#
#   当前声明版本对应的 tag（gospeak-server-v<version> /
#   gospeak-desktop-v<version>）已存在
#     → 版本号没变 → 打 tag 步骤 skipped，也不触发发布；
#   服务端 tag 不存在（新版本号）
#     → 打两个 tag → 直接 workflow_call 调用 release.yml 执行发布。
#
# 为什么不是「推 tag 后由 release.yml 的 on.push.tags 触发」：
# GitHub 会抑制由 GITHUB_TOKEN 推送所派生的 workflow（防递归），
# tag 推上去了但 Release / Docker 都不会跑。workflow_call 是 job 级调用，
# 不受该限制，也不需要额外的 PAT。
#
# 桌面端 tag 仅作为 changelog 基线保留，不再单独建 Release；
# 两个组件的产物都发布到服务端 tag 下的同一个 Release。
#
# 也可 workflow_dispatch 手动触发一次对账（只补缺失的 tag，不覆盖已有）。

name: Version Bump

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-tags:
    name: Release declared versions (skip unchanged)
    runs-on: ubuntu-latest
    outputs:
      # 服务端 tag 是本次是否发版的唯一判据：桌面端只在服务端发版时跟随。
      released: ${{ steps.gate.outputs.released }}
      version: ${{ steps.versions.outputs.server }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        # git tag -a 会创建 annotated tag，必须有 committer 身份；
        # runner 默认没有配置，缺失时会以 "empty ident name" 直接失败。
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read declared versions
        id: versions
        run: |
          set -euo pipefail
          read_version() {
            node -e '
              const { readFileSync } = require("node:fs");
              const src = readFileSync(process.argv[1], "utf8");
              const m = src.match(/^version:[ \t]*["'"'"']?([^\s#"'"'"']+)["'"'"']?[ \t]*(?:#.*)?$/m);
              if (!m) { console.error("missing version in " + process.argv[1]); process.exit(1); }
              console.log(m[1]);
            ' "$1"
          }
          {
            echo "server=$(read_version .github/versions/server.yaml)"
            echo "desktop=$(read_version .github/versions/desktop.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Detect published tags
        id: tags
        env:
          SERVER_VERSION: ${{ steps.versions.outputs.server }}
          DESKTOP_VERSION: ${{ steps.versions.outputs.desktop }}
        run: |
          set -euo pipefail
          # 一次性探测两个组件的 tag 是否已存在于远程，避免逐个 ls-remote。
          git ls-remote --tags origin > "$RUNNER_TEMP/remote-tags.txt"

          check() {
            local component="$1" version="$2"
            local tag
            tag="$(node scripts/release-naming.mjs tag "$component" "$version")"
            if grep -qE "refs/tags/${tag}(\^\{\})?$" "$RUNNER_TEMP/remote-tags.txt"; then
              echo "${component}_exists=true" >> "$GITHUB_OUTPUT"
              echo "::notice::${component} ${version} 已发布（tag ${tag} 存在），跳过。"
            else
              echo "${component}_exists=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${component} ${version} 尚未发布，将创建 tag ${tag}。"
            fi
          }

          check server "$SERVER_VERSION"
          check desktop "$DESKTOP_VERSION"

      - name: Decide whether to publish
        id: gate
        env:
          SERVER_EXISTS: ${{ steps.tags.outputs.server_exists }}
        run: |
          set -euo pipefail
          # 只以服务端 tag 是否新建为发版判据：它是单一 Release 的锚点。
          if [ "$SERVER_EXISTS" = "false" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::服务端版本变更，将创建 tag 并触发发布"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice::服务端版本未变更，本次不发布"
          fi

      - name: Tag server release if version changed
        if: steps.tags.outputs.server_exists == 'false'
        env:
          VERSION: ${{ steps.versions.outputs.server }}
        run: |
          set -euo pipefail
          tag="$(node scripts/release-naming.mjs tag server "$VERSION")"
          sha="$(git rev-parse HEAD)"
          git tag -a "$tag" -m "Release ${tag} (declared in .github/versions/server.yaml)" "$sha"
          git push origin "refs/tags/${tag}"
          echo "::notice::created tag ${tag} at ${sha}"

      - name: Tag desktop release if version changed
        if: steps.tags.outputs.desktop_exists == 'false'
        env:
          VERSION: ${{ steps.versions.outputs.desktop }}
        run: |
          set -euo pipefail
          tag="$(node scripts/release-naming.mjs tag desktop "$VERSION")"
          sha="$(git rev-parse HEAD)"
          git tag -a "$tag" -m "Release ${tag} (declared in .github/versions/desktop.yaml)" "$sha"
          git push origin "refs/tags/${tag}"
          echo "::notice::created tag ${tag} at ${sha}"

      - name: Summary
        env:
          SERVER_VERSION: ${{ steps.versions.outputs.server }}
          SERVER_EXISTS: ${{ steps.tags.outputs.server_exists }}
          DESKTOP_VERSION: ${{ steps.versions.outputs.desktop }}
          DESKTOP_EXISTS: ${{ steps.tags.outputs.desktop_exists }}
        run: |
          set -euo pipefail
          status() {
            if [ "$1" = "true" ]; then
              echo "skipped（版本未更新，已发布过）"
            else
              echo "released（已打 tag 触发发布）"
            fi
          }
          server_tag="$(node scripts/release-naming.mjs tag server "$SERVER_VERSION")"
          desktop_tag="$(node scripts/release-naming.mjs tag desktop "$DESKTOP_VERSION")"
          {
            echo "## Version Bump"
            echo ""
            echo "| 组件 | 声明版本 | tag | 结果 |"
            echo "| --- | --- | --- | --- |"
            echo "| 服务端 (server) | ${SERVER_VERSION} | \`${server_tag}\` | $(status "${SERVER_EXISTS}") |"
            echo "| 桌面端 (desktop) | ${DESKTOP_VERSION} | \`${desktop_tag}\` | $(status "${DESKTOP_EXISTS}") |"
            echo ""
            if [ "${SERVER_EXISTS}" = "true" ] && [ "${DESKTOP_EXISTS}" = "true" ]; then
              echo "两个组件版本号均未变化，本次未触发任何发布。"
              echo "如需发版，请修改 \`.github/versions/*.yaml\` 的 version 后合入 release。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 发布编排 ────────────────────────────────────────────────────────────
  # 直接调用 release.yml，而不是等 tag push 派生 workflow —— GITHUB_TOKEN
  # 推送的 tag 不会触发 downstream workflow。
  release:
    name: Publish release
    needs: [bump-tags]
    if: needs.bump-tags.outputs.released == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.bump-tags.outputs.version }}
