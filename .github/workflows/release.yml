# GOSpeak Auto Release CI
#
# push 到 release 分支时自动发版：
#   1. 质量门禁（build + test）
#   2. 从 Conventional Commits 推断下一个版本号（breaking → major / feat → minor / 其他 → patch）
#   3. 打 annotated tag 并创建 GitHub Release（自动生成更新日志）
#   4. 构建 Docker 镜像推送到 GHCR（amd64/arm64，注入版本元数据）
#   5. 交叉编译 10 平台二进制并上传到 Release Assets（注入版本元数据）
#   6. 汇总所有二进制生成 SHA256SUMS 并上传到 Release Assets
#
# 手动触发 workflow_dispatch 可指定 tag 或使用自动推断。
# 在 commit message 中加入 [skip release] 可跳过本次自动发版。

name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = auto from Conventional Commits)"
        required: false
        default: ""
        type: string
      skip_build:
        description: "Skip cross-platform binary builds"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Quality Gate ──────────────────────────────────────────────────────────
  build:
    name: Quality Gate (build/test)
    uses: ./.github/workflows/build.yml
    with:
      run_tests: true

  # ── Auto Version ──────────────────────────────────────────────────────────
  auto-version:
    name: Determine Next Version
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: version
        env:
          MANUAL_TAG: ${{ inputs.tag || '' }}
        run: |
          set -euo pipefail

          last_msg="$(git log --format='%B' -1 HEAD)"
          if echo "$last_msg" | grep -qi '\[skip release\]\|\[skip ci\]'; then
            echo "::notice::Skipping release ([skip release] detected)"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$MANUAL_TAG" ]; then
            echo "::notice::Using manual tag: $MANUAL_TAG"
            echo "tag=$MANUAL_TAG" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest="$(git tag --sort=-v:refname --list 'v[0-9]*.[0-9]*.[0-9]*' | head -1)"
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          echo "Latest tag: $latest"

          breaking="$(git log "${latest}..HEAD" --format='%s%n%b' \
            | grep -ciE '(^[a-z]+(\(.+\))?!:|^BREAKING CHANGE[: ])' || true)"
          feat_count="$(git log "${latest}..HEAD" --format='%s' \
            | grep -ciE '^feat(\(.+\))?:' || true)"

          echo "Breaking: $breaking / Features: $feat_count"

          current="${latest#v}"
          IFS='.' read -r major minor patch <<< "$current"

          if [ "$breaking" -gt 0 ]; then
            major=$((major+1)); minor=0; patch=0
            bump_type="major"
          elif [ "$feat_count" -gt 0 ]; then
            minor=$((minor+1)); patch=0
            bump_type="minor"
          else
            patch=$((patch+1))
            bump_type="patch"
          fi

          new_tag="v${major}.${minor}.${patch}"
          echo "::notice::Version bump: $latest -> $new_tag ($bump_type)"

          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  # ── Tag & Create Release ─────────────────────────────────────────────────
  prepare-release:
    name: Tag & Create Release
    runs-on: ubuntu-latest
    needs: [build, auto-version]
    if: needs.auto-version.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        env:
          TAG: ${{ needs.auto-version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG" "${{ github.sha }}"
          git push origin "$TAG"

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ needs.auto-version.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES_FILE="/tmp/release-notes.md"

          prev="$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            prev="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi

          {
            echo "# GOSpeak ${TAG}"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev}...${TAG}"
            echo ""

            range="${prev}..HEAD"
            body_written=false

            for pair in "feat:Features" "fix:Bug Fixes" "refactor:Refactoring" \
                        "perf:Performance" "style:Style" "docs:Documentation" \
                        "ci:CI/CD" "test:Tests" "chore:Chores"; do
              type="${pair%%:*}"
              label="${pair#*:}"
              commits="$(git log "$range" --format='%s' | grep -E "^${type}[(:!]" || true)"
              if [ -n "$commits" ]; then
                echo "### ${label}"
                echo ""
                while IFS= read -r msg; do
                  echo "* ${msg}"
                done <<< "$commits"
                echo ""
                body_written=true
              fi
            done

            other="$(git log "$range" --format='%s' | grep -vE '^(feat|fix|refactor|perf|style|docs|ci|test|chore)[(:!]' | grep -vE '^Merge (pull request|branch)' || true)"
            if [ -n "$other" ]; then
              echo "### Other Changes"
              echo ""
              while IFS= read -r msg; do
                echo "* ${msg}"
              done <<< "$other"
              echo ""
              body_written=true
            fi

            if [ "$body_written" = false ]; then
              echo "_No categorized commits found._"
            fi
          } > "$NOTES_FILE"

          cat "$NOTES_FILE"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.auto-version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "GOSpeak $TAG" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            --target "${{ github.sha }}"

  # ── Docker Image ──────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build, auto-version, prepare-release]
    if: >-
      ${{ needs.auto-version.outputs.should_release == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.skip_build) }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.auto-version.outputs.tag }}
            COMMIT=${{ github.sha }}

  # ── Cross-Platform Binaries ───────────────────────────────────────────────
  build-release-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [build, auto-version, prepare-release]
    if: >-
      ${{ needs.auto-version.outputs.should_release == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.skip_build) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: freebsd-amd64
            goos: freebsd
            goarch: amd64
            ext: ""
          - target: freebsd-arm64
            goos: freebsd
            goarch: arm64
            ext: ""
          - target: openbsd-amd64
            goos: openbsd
            goarch: amd64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/web/dist

      - name: Embed frontend into server
        run: |
          rm -rf app/server/internal/webui/dist
          mkdir -p app/server/internal/webui/dist
          cp -R app/web/dist/. app/server/internal/webui/dist/
          test -f app/server/internal/webui/dist/index.html

      - name: Build binary
        working-directory: app/server
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          RELEASE_VERSION: ${{ needs.auto-version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          go build \
            -ldflags="-s -w \
              -X 'GOSpeak/cmd.version=${RELEASE_VERSION}' \
              -X 'GOSpeak/cmd.commit=${RELEASE_COMMIT}'" \
            -o "gospeak-${{ matrix.target }}${{ matrix.ext }}" main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gospeak-${{ matrix.target }}
          path: app/server/gospeak-${{ matrix.target }}${{ matrix.ext }}
          retention-days: 14

      - name: Upload to release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.auto-version.outputs.tag }}
        run: |
          echo "Uploading to release $TAG..."
          gh release upload "$TAG" \
            "app/server/gospeak-${{ matrix.target }}${{ matrix.ext }}" --clobber

  # ── SHA256SUMS ──────────────────────────────────────────────────────────────
  checksums:
    name: Generate & Upload SHA256SUMS
    runs-on: ubuntu-latest
    needs: [build, auto-version, prepare-release, build-release-binaries]
    if: >-
      ${{ needs.auto-version.outputs.should_release == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.skip_build) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gospeak-*
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum gospeak-* > SHA256SUMS.txt
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.auto-version.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "dist/SHA256SUMS.txt" --clobber
