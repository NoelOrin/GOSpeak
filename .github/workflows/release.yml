# GOSpeak Release CI
# 发布构建：先复用 Build 质量门禁；workflow_dispatch 时按自定义 tag 打 tag + 创建 Release（含更新内容与 PR），
# 随后构建 Docker 镜像与跨平台二进制并上传到 Release assets。兼容 release:published（tag 已存在时仅构建产物）。
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3.0"
        required: true
        type: string
      release_build:
        description: "Build cross-platform release binaries"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先跑质量门禁（复用 build.yml），通过后再发布构建
  build:
    name: Quality Gate (build/test)
    uses: ./.github/workflows/build.yml
    with:
      run_tests: true

  # workflow_dispatch 时：按自定义 tag 打 tag、推送并创建 Release（notes 含变更与 PR）
  prepare-release:
    name: Tag & Create Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Create and push tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          git tag -a "$TAG" -m "GOSpeak $TAG"
          git push origin "$TAG"
      - name: Create GitHub Release (notes + PRs)
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "GOSpeak $TAG" \
            --generate-notes \
            --target "${{ github.ref_name }}"

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build, prepare-release]
    if: >-
      ${{ github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_build) }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  build-release-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [build, prepare-release]
    if: >-
      ${{ github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_build) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: freebsd-amd64
            goos: freebsd
            goarch: amd64
            ext: ""
          - target: freebsd-arm64
            goos: freebsd
            goarch: arm64
            ext: ""
          - target: openbsd-amd64
            goos: openbsd
            goarch: amd64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true
      - name: Download web dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: app/web/dist
      - name: Embed frontend into server
        run: |
          rm -rf app/server/internal/webui/dist
          mkdir -p app/server/internal/webui/dist
          cp -R app/web/dist/. app/server/internal/webui/dist/
          test -f app/server/internal/webui/dist/index.html
      - name: Build binary
        working-directory: app/server
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -ldflags="-s -w" -o "gospeak-${{ matrix.target }}${{ matrix.ext }}" main.go
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-${{ matrix.target }}
          path: app/server/gospeak-${{ matrix.target }}${{ matrix.ext }}
          retention-days: 14
      - name: Upload to release assets
        if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          echo "Uploading to release $TAG..."
          gh release upload "$TAG" "app/server/gospeak-${{ matrix.target }}${{ matrix.ext }}" --clobber
      - name: Verify binary
        if: matrix.goos != 'windows'
        run: |
          file app/server/gospeak-${{ matrix.target }}
          strings app/server/gospeak-${{ matrix.target }} | grep -q '<!DOCTYPE html>' || \
            strings app/server/gospeak-${{ matrix.target }} | grep -q 'index.html' || \
            echo "WARN: could not confirm embedded HTML via strings"
      - name: Verify binary (windows)
        if: matrix.goos == 'windows'
        run: |
          f="${{ matrix.target }}"
          file "app/server/gospeak-${f}.exe"
