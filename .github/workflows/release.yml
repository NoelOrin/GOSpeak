# GOSpeak Release CI —— 双组件、显式版本声明驱动。
#
# 版本号来源：.github/versions/server.yaml（服务端 + Web）与
# .github/versions/desktop.yaml（桌面端）各自显式声明。合入 release 后由
# version-bump.yml 自动打 tag；也可手动 push tag 或 workflow_dispatch 补跑。
#
# 命名规范（单一事实来源：scripts/release-naming.mjs）：
#   gospeak-<component>-v<semver>[-<os>-<arch>][.ext]
#
#   组件    tag                       二进制
#   server  gospeak-server-v1.0.0     gospeak-server-v1.0.0-linux-amd64
#   desktop gospeak-desktop-v1.0.0    gospeak-desktop-v1.0.0-darwin-arm64.dmg
#
#   校验和：SHA256SUMS-gospeak-<component>-v<version>.txt
#
# 发生什么：
#   gospeak-server-v*  → 服务端发布链：版本校验（以 server.yaml 为准）→
#                        Release notes + GitHub Release → 一次性 Web 构建 →
#                        交叉编译 10 平台二进制 → SHA256SUMS。
#                        Docker 镜像由 docker.yml 在同一 tag 并行发布。
#   gospeak-desktop-v* → 桌面端发布链：版本校验（以 desktop.yaml 为准）→
#                        Release（notes 优先取 yaml 的 notes 字段）→
#                        GOSPEAK_TARGET=desktop 条件编译构建 Web → go:embed
#                        进桌面宿主 → 5 平台安装包 → SHA256SUMS-desktop。
#
# workflow_dispatch 支持手动补跑（tag 留空则取最新发布 tag），产物幂等覆盖（--clobber）。

name: Release

on:
  push:
    tags: ["gospeak-server-v*", "gospeak-desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = latest release tag)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Resolve Tag & Component ─────────────────────────────────────────────
  resolve-tag:
    name: Resolve Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      component: ${{ steps.tag.outputs.component }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ] && [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            tag="${GITHUB_REF_NAME:-}"
          fi
          if [ -z "$tag" ]; then
            # 最新发布 tag（两个组件混排，按创建时间取最新）
            tag="$(git for-each-ref --sort=-creatordate \
              --format='%(refname:short)' refs/tags \
              | grep -E '^gospeak-(server|desktop)-v[0-9]' | head -n1 || true)"
          fi
          parsed="$(node scripts/release-naming.mjs parse "$tag" || true)"
          if [ -z "$parsed" ]; then
            echo "::error::Tag '${tag}' does not follow gospeak-<component>-v<semver>"
            exit 1
          fi
          component="${parsed%% *}"
          version="${parsed##* }"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "component=$component"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Release tag: $tag (component=$component version=$version)"

  version-check:
    name: Check Release Version (${{ needs.resolve-tag.outputs.component }})
    runs-on: ubuntu-latest
    needs: [resolve-tag]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - name: Validate release tag against declared version
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
          COMPONENT: ${{ needs.resolve-tag.outputs.component }}
        run: node scripts/check-version.mjs . "$RELEASE_TAG" "$COMPONENT"
  # ── Create Release ───────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve-tag.outputs.version }}
      COMPONENT: ${{ needs.resolve-tag.outputs.component }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate component notes
        id: component-notes
        run: |
          set -euo pipefail
          # notes 优先取版本声明 yaml 的 notes 字段（显式声明，支持块标量多行）；
          # 留空则按 commit 生成，基线按组件区分（只认本组件的历史 tag），
          # 避免把一个组件的提交历史错算成另一个的。
          cat > /tmp/read-notes.mjs <<'EOF'
          import { readFileSync } from "node:fs";
          const src = readFileSync(process.argv[2], "utf8");
          const block = src.match(/^notes:[ \t]*\|\n((?:[ \t]*[^\n]*\n?)+)/m);
          if (block) {
            console.log(
              block[1].replace(/^[ \t]+/gm, "").replace(/^\n+|\n+$/g, ""),
            );
            process.exit(0);
          }
          const flow = src.match(/^notes:[ \t]*(?:"([^"]*)"|'([^']*)'|([^#\n]*))/m);
          const value = (flow ? (flow[1] ?? flow[2] ?? flow[3]) : "").trim();
          console.log(value);
          EOF
          node /tmp/read-notes.mjs ".github/versions/${COMPONENT}.yaml" > /tmp/decl-notes.txt
          if [ -s /tmp/decl-notes.txt ]; then
            cp /tmp/decl-notes.txt /tmp/component-notes.md
          else
            prefix="$(node scripts/release-naming.mjs prefix "$COMPONENT")"
            base="$(git for-each-ref --sort=-creatordate \
              --format='%(refname:short)' refs/tags \
              | grep -F "$prefix" | grep -Fvx "$RELEASE_TAG" | head -n1 || true)"
            if [ -n "$base" ]; then
              node scripts/build-changelog.mjs "$RELEASE_VERSION" "$base" --no-write > /tmp/component-notes.md
            else
              echo "* 首个 ${COMPONENT} 版本。" > /tmp/component-notes.md
            fi
          fi
          test -s /tmp/component-notes.md

      - name: Resolve desktop release for cross-link
        id: desktop
        if: needs.resolve-tag.outputs.component == 'server'
        run: |
          set -euo pipefail
          # 服务端 release 正文顶部要放桌面端下载表格。只有桌面端 release 真的
          # 存在时才渲染表格，否则给出 Releases 页链接，避免死链 404。
          desktop_version="$(node -e '
            const { readFileSync } = require("node:fs");
            const src = readFileSync(".github/versions/desktop.yaml", "utf8");
            const m = src.match(/^version:[ \t]*["'"'"']?([^\s#"'"'"']+)["'"'"']?[ \t]*(?:#.*)?$/m);
            if (m) console.log(m[1]);
          ')"
          echo "version=$desktop_version" >> "$GITHUB_OUTPUT"
          if [ -n "$desktop_version" ]; then
            desktop_tag="$(node scripts/release-naming.mjs tag desktop "$desktop_version")"
            if gh release view "$desktop_tag" >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "::notice::found desktop release ${desktop_tag}"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "::notice::desktop release ${desktop_tag} not published yet"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Render release body
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$COMPONENT" \
            --version "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file /tmp/component-notes.md \
            --desktop-version '${{ steps.desktop.outputs.version }}' \
            ${{ steps.desktop.outputs.exists == 'true' && '--desktop-release-exists' || '' }} \
            > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          echo "=== rendered release body (head) ==="
          head -20 /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          target_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          release_args=(
            "$RELEASE_TAG"
            --target "$target_sha"
            --title "$RELEASE_TAG"
            --notes-file /tmp/release-notes.md
          )
          # 预发布版本（含 - / + 的语义化版本）自动标记 prerelease
          if [[ "$RELEASE_VERSION" == *-* ]] || [[ "$RELEASE_VERSION" == *+* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "${release_args[@]}"

  # ── Build Web Once（两个组件共用：desktop 以条件编译目标构建）──────────────
  build-web:
    name: Build Web Artifact
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check]
    permissions:
      contents: read
    env:
      # 桌面端以 GOSPEAK_TARGET=desktop 构建（__GOSPEAK_DESKTOP__=true，
      # 桌面分支进包）；主体按默认 web 目标构建（桌面分支被裁剪）。
      GOSPEAK_TARGET: ${{ needs.resolve-tag.outputs.component == 'desktop' && 'desktop' || 'web' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - uses: ./.github/actions/pnpm-install

      - name: Build web dist
        run: pnpm --filter @gospeak/web build

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-web-dist
          path: app/web/dist
          retention-days: 3

  # ── 主体：Cross-Platform Server Binaries ────────────────────────────────
  build-release-binaries:
    name: Build server ${{ matrix.target }}
    if: needs.resolve-tag.outputs.component == 'server'
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check, create-release, build-web]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: freebsd-amd64
            goos: freebsd
            goarch: amd64
            ext: ""
          - target: freebsd-arm64
            goos: freebsd
            goarch: arm64
            ext: ""
          - target: openbsd-amd64
            goos: openbsd
            goarch: amd64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: release-web-dist
          path: app/web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true

      - name: Embed frontend into server
        run: |
          rm -rf app/server/internal/webui/dist
          mkdir -p app/server/internal/webui/dist
          cp -R app/web/dist/. app/server/internal/webui/dist/
          test -f app/server/internal/webui/dist/index.html

      - name: Resolve checked out commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve artifact name
        id: name
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          # 规范名由 release-naming.mjs 派生，workflow 里不手拼。
          # 用 matrix.target 而非 goos+goarch：linux-armv7 的 goarch 只是 arm，
          # 拼出来会丢 v7 版本位。
          echo "artifact=$(node scripts/release-naming.mjs artifact-target server "$VERSION" \
            '${{ matrix.target }}' '${{ matrix.ext }}')" >> "$GITHUB_OUTPUT"

      - name: Build binary
        working-directory: app/server
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          RELEASE_VERSION: ${{ needs.resolve-tag.outputs.version }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          ARTIFACT: ${{ steps.name.outputs.artifact }}
        run: |
          go build \
            -ldflags="-s -w \
              -X 'GOSpeak/internal/buildinfo.Version=${RELEASE_VERSION}' \
              -X 'GOSpeak/internal/buildinfo.Commit=${RELEASE_COMMIT}'" \
            -o "$ARTIFACT" main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-server-${{ matrix.target }}
          path: app/server/${{ steps.name.outputs.artifact }}
          retention-days: 14

      - name: Upload to release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          ARTIFACT: ${{ steps.name.outputs.artifact }}
        run: |
          echo "Uploading to release $TAG..."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping upload."
            exit 0
          fi
          gh release upload "$TAG" "app/server/${ARTIFACT}" --clobber

  # ── 主体：SHA256SUMS ────────────────────────────────────────────────────
  checksums:
    name: Generate & Upload SHA256SUMS
    if: needs.resolve-tag.outputs.component == 'server'
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check, create-release, build-release-binaries]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gospeak-server-*
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          # 文件名带组件与版本，服务端/桌面端产物不会互相覆盖或混淆。
          name="$(node "$GITHUB_WORKSPACE/scripts/release-naming.mjs" checksum server "$VERSION")"
          sha256sum gospeak-server-* > "$name"
          echo "=== $name ==="
          cat "$name"
          echo "checksum_file=$name" >> "$GITHUB_OUTPUT"
        id: sums

      - name: Upload SHA256SUMS to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          SUMS: ${{ steps.sums.outputs.checksum_file }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping SHA256SUMS upload."
            exit 0
          fi
          gh release upload "$TAG" "dist/${SUMS}" --clobber

  # ── 桌面端：Cross-Platform Desktop Binaries ─────────────────────────────
  # ── 桌面端：macOS 安装包（DMG，需要 macOS runner 的 hdiutil）──────────────
  build-desktop-macos:
    name: Build desktop macOS ${{ matrix.arch }}
    if: needs.resolve-tag.outputs.component == 'desktop'
    runs-on: macos-latest
    needs: [resolve-tag, version-check, create-release, build-web]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            goarch: arm64
          - arch: amd64
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: release-web-dist
          path: app/web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/desktop/go.mod
          cache: true
          cache-dependency-path: app/desktop/go.sum

      # mygo 来自 app/desktop 的 devDependencies，必须装依赖才能调用
      - uses: ./.github/actions/pnpm-install

      - name: Embed frontend into desktop host
        run: |
          rm -rf app/desktop/webui/dist
          mkdir -p app/desktop/webui/dist
          cp -R app/web/dist/. app/desktop/webui/dist/
          test -f app/desktop/webui/dist/index.html

      - name: Resolve checked out commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # DMG 安装包：mygo build 产出 .app + dmg，Finder 里是「拖到 Applications」的
      # 标准安装体验。hdiutil 只有 macOS 有，所以这个作业跑在 macos runner 上。
      #
      # 版本号通过 MYGO_LDFLAGS 注入 main.version/main.commit（mygo 会把它们与
      # packageFlags 合并），保证 --version 与 tag 一致。
      - name: Build macOS app and DMG
        working-directory: app/desktop
        env:
          CGO_ENABLED: 0
          GOSPEAK_TARGET: desktop
          MYGO_LDFLAGS: >-
            -X 'main.version=${{ needs.resolve-tag.outputs.version }}'
            -X 'main.commit=${{ steps.source.outputs.commit }}'
        run: |
          ./node_modules/.bin/mygo build \
            -skip-build-command \
            -platform "darwin/${{ matrix.goarch }}"

      # 用途说明缺失说明打包链路有问题：直接失败，不发一个麦克风不可用的包。
      - name: Verify bundle metadata
        working-directory: app/desktop
        run: |
          APP="$(find dist -maxdepth 2 -type d -name GOSpeak.app -print -quit)"
          test -n "$APP" -a -d "$APP"
          plutil -p "$APP/Contents/Info.plist" | grep -q NSMicrophoneUsageDescription
          plutil -p "$APP/Contents/Info.plist" | grep -q NSCameraUsageDescription
          DMG="$(find dist -maxdepth 2 -type f -name '*.dmg' -print -quit)"
          test -n "$DMG" -a -f "$DMG"
          # 挂载一次确认镜像可读且包含 .app 与 /Applications 链接。
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint /tmp/gospeak-dmg
          ls /tmp/gospeak-dmg/GOSpeak.app >/dev/null
          test -L /tmp/gospeak-dmg/Applications
          hdiutil detach /tmp/gospeak-dmg
          echo "DMG verified: $DMG"

      - name: Normalize artifact name
        id: name
        working-directory: app/desktop
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          # mygo 产出的 dmg 名由 mygo.config.ts 的 version 决定，格式不受我们控制。
          # 这里统一重命名为 gospeak-desktop-v<ver>-darwin-<arch>.dmg，
          # 与服务端产物/tag 命名一一对应。
          src="$(find dist -maxdepth 2 -type f -name '*.dmg' -print -quit)"
          test -n "$src" -a -f "$src"
          out="$(node "$GITHUB_WORKSPACE/scripts/release-naming.mjs" artifact desktop "$VERSION" darwin '${{ matrix.arch }}' dmg)"
          cp "$src" "dist/$out"
          echo "artifact=$out" >> "$GITHUB_OUTPUT"
          echo "normalized: $src -> dist/$out"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-desktop-darwin-${{ matrix.arch }}
          path: app/desktop/dist/${{ steps.name.outputs.artifact }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          ARTIFACT: ${{ steps.name.outputs.artifact }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping upload."
            exit 0
          fi
          gh release upload "$TAG" "app/desktop/dist/${ARTIFACT}" --clobber

  # ── 桌面端：Linux / Windows 安装包 ──────────────────────────────────────
  build-desktop-others:
    name: Build desktop ${{ matrix.target }}
    if: needs.resolve-tag.outputs.component == 'desktop'
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check, create-release, build-web]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: release-web-dist
          path: app/web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/desktop/go.mod
          cache: true
          cache-dependency-path: app/desktop/go.sum

      # mygo 来自 app/desktop 的 devDependencies，必须装依赖才能调用
      - uses: ./.github/actions/pnpm-install

      - name: Embed frontend into desktop host
        run: |
          rm -rf app/desktop/webui/dist
          mkdir -p app/desktop/webui/dist
          cp -R app/web/dist/. app/desktop/webui/dist/
          test -f app/desktop/webui/dist/index.html

      - name: Resolve checked out commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # mygo 只在 Windows 上自动下载 NSIS；Linux runner 必须预装 makensis，
      # 否则它会跳过安装包只留下裸 exe（构建仍然"成功"，很容易漏掉）。
      - name: Install NSIS (Windows installer toolchain)
        if: matrix.goos == 'windows'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          makensis -VERSION

      # Linux 出 .deb（双击即装）+ tar.gz + install.sh（一键脚本）；
      # Windows 出 NSIS 安装包。两者都不需要宿主机是目标平台。
      - name: Build installers
        working-directory: app/desktop
        env:
          CGO_ENABLED: 0
          GOSPEAK_TARGET: desktop
          MYGO_LDFLAGS: >-
            -X 'main.version=${{ needs.resolve-tag.outputs.version }}'
            -X 'main.commit=${{ steps.source.outputs.commit }}'
        run: |
          ./node_modules/.bin/mygo build \
            -skip-build-command \
            -platform "${{ matrix.goos }}/${{ matrix.goarch }}"

      # mygo 在 makensis 缺失时只打一条 warning 并继续，构建仍"成功"，
      # 产物里没有安装包。这里显式断言，避免静默发出裸 exe。
      - name: Verify installers were produced
        working-directory: app/desktop
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "${{ matrix.goos }}" = "windows" ]; then
            files=(dist/windows-*/*-setup-*.exe)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::No Windows installer produced (NSIS missing?)"
              ls -la dist/windows-*/ || true
              exit 1
            fi
            echo "Windows installer: ${files[0]}"
          else
            debs=(dist/linux-*/*.deb)
            tarballs=(dist/linux-*/*.tar.gz)
            if [ ${#debs[@]} -eq 0 ] || [ ${#tarballs[@]} -eq 0 ]; then
              echo "::error::Missing Linux packages (.deb / .tar.gz)"
              ls -la dist/linux-*/ || true
              exit 1
            fi
            echo "Linux packages: ${debs[0]}, ${tarballs[0]}"
          fi

      - name: Normalize artifact names
        id: name
        working-directory: app/desktop
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
          GOOS: ${{ matrix.goos }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # 统一成 gospeak-desktop-v<ver>-<os>-<arch>.<ext>；install.sh 保持原名
          # （它是脚本而非二进制产物，改名会破坏文档里的安装指引）。
          naming="$GITHUB_WORKSPACE/scripts/release-naming.mjs"
          shopt -s nullglob
          files=()
          for src in dist/"${GOOS}"-*/*.deb dist/"${GOOS}"-*/*.tar.gz dist/"${GOOS}"-*/*-setup-*.exe; do
            case "$src" in
              *.deb)     ext=deb ;;
              *.tar.gz)  ext=tar.gz ;;
              *.exe)     ext=exe ;;
              *)         continue ;;
            esac
            out="$(node "$naming" artifact-target desktop "$VERSION" "$TARGET" "$ext")"
            cp "$src" "dist/$out"
            files+=("$out")
            echo "normalized: $src -> dist/$out"
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No packages to normalize"
            exit 1
          fi
          printf '%s\n' "${files[@]}" > /tmp/normalized.txt
          cat /tmp/normalized.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-desktop-${{ matrix.target }}
          path: |
            app/desktop/dist/gospeak-desktop-v*
            app/desktop/dist/${{ matrix.goos }}-*/install.sh
          if-no-files-found: error
          retention-days: 14

      - name: Upload to release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          GOOS: ${{ matrix.goos }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping upload."
            exit 0
          fi
          shopt -s nullglob
          for f in app/desktop/dist/gospeak-desktop-v* \
                   app/desktop/dist/"${GOOS}"-*/install.sh; do
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done

  desktop-checksums:
    name: Generate & Upload desktop SHA256SUMS
    if: needs.resolve-tag.outputs.component == 'desktop'
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check, create-release, build-desktop-macos, build-desktop-others]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gospeak-desktop-*
          path: dist/
          merge-multiple: true

      - name: Generate desktop SHA256SUMS
        id: sums
        working-directory: dist
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          # 产物是 dmg / deb / tar.gz / setup.exe / install.sh，名字各不相同，
          # 逐个列出而不是靠前缀通配。
          #
          # 注意：install.sh 是字面文件名而不是 glob，nullglob 对它无效——
          # 文件不存在时它仍会留在数组里，导致 sha256sum 报
          # "install.sh: No such file or directory"。所以单独判断存在性再追加。
          shopt -s nullglob
          files=(*.dmg *.deb *.tar.gz *.exe)
          for f in install.sh; do
            [ -f "$f" ] && files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No desktop artifacts found to checksum"
            ls -la
            exit 1
          fi
          name="$(node "$GITHUB_WORKSPACE/scripts/release-naming.mjs" checksum desktop "$VERSION")"
          sha256sum "${files[@]}" | sort -k2 > "$name"
          echo "=== $name ==="
          cat "$name"
          echo "checksum_file=$name" >> "$GITHUB_OUTPUT"

      - name: Upload desktop SHA256SUMS to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          SUMS: ${{ steps.sums.outputs.checksum_file }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping SHA256SUMS upload."
            exit 0
          fi
          gh release upload "$TAG" "dist/${SUMS}" --clobber

  # ── 桌面端发布完成后，回填服务端 release 正文 ──────────────────────────
  # 两个组件是独立发布的：服务端先建 release 时桌面端还不存在，正文里的
  # 下载表格会退化成一句 Releases 页链接。桌面端发布成功后再重写一次
  # 服务端正文，让用户点进服务端 release 就能直接下载桌面端安装包。
  sync-server-notes:
    name: Sync desktop downloads into server release notes
    if: needs.resolve-tag.outputs.component == 'desktop'
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check, create-release, build-desktop-macos, build-desktop-others, desktop-checksums]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - name: Resolve server release
        id: server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 服务端 release 以 server.yaml 声明的版本为准；未发布则跳过回填。
          version="$(node -e '
            const { readFileSync } = require("node:fs");
            const src = readFileSync(".github/versions/server.yaml", "utf8");
            const m = src.match(/^version:[ \t]*["'"'"']?([^\s#"'"'"']+)["'"'"']?[ \t]*(?:#.*)?$/m);
            if (m) console.log(m[1]);
          ')"
          if [ -z "$version" ]; then
            echo "::notice::server.yaml 无 version，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="$(node scripts/release-naming.mjs tag server "$version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::找到服务端 release ${tag}，将回填桌面端下载表格"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::服务端 release ${tag} 尚未发布，跳过回填"
          fi

      - name: Rebuild server body with desktop table
        if: steps.server.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_TAG: ${{ steps.server.outputs.tag }}
          SERVER_VERSION: ${{ steps.server.outputs.version }}
          DESKTOP_VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          # 服务端原有的 release notes 段落要保留：先取回正文，截取分隔线
          # 之后的内容作为 notes，再交给渲染器重新排版。
          gh release view "$SERVER_TAG" --json body -q .body > /tmp/server-body.md
          awk '/^## 服务端 release notes$/{f=1;next} f' /tmp/server-body.md > /tmp/server-notes.md
          if [ ! -s /tmp/server-notes.md ]; then
            echo "* 本次发布无额外说明。" > /tmp/server-notes.md
          fi

          node scripts/release-notes.mjs server \
            --version "$SERVER_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file /tmp/server-notes.md \
            --desktop-version "$DESKTOP_VERSION" \
            --desktop-release-exists > /tmp/server-body-new.md

          if cmp -s /tmp/server-body.md /tmp/server-body-new.md; then
            echo "::notice::服务端正文已是最新，无需更新"
            exit 0
          fi
          gh release edit "$SERVER_TAG" --notes-file /tmp/server-body-new.md
          echo "::notice::已回填桌面端下载表格到 ${SERVER_TAG}"
