# GOSpeak Auto Release CI
#
# GOSpeak Release — 产物发布（由 release-please 攒批发版后触发）
#   触发：release.published（合并 Release PR 后）或 workflow_dispatch（dry_run 预览）
#   4. 交叉编译 10 平台二进制并上传到 Release Assets（注入版本元数据）
#   5. 汇总所有二进制生成 SHA256SUMS 并上传到 Release Assets
#
# workflow_dispatch: tag 为空时取 release 事件 tag，dry_run 仅预览不发布；构建与 release-please 并行

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = tag_name of release event)"
        required: false
        default: ""
        type: string
      skip_build:
        description: "Skip cross-platform binary builds"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Preview tag/changelog without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Resolve Tag ─────────────────────────────────────────────────────────
  resolve-tag:
    name: Resolve Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="${INPUT_TAG:-}"
          fi
          if [ -z "$tag" ]; then
            echo "::error::No tag from release event or inputs.tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "::notice::Release tag: $tag dry_run=${DRY_RUN:-false}"
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "::notice::dry_run enabled — no publish will occur"
          fi

  version-check:
    name: Check Release Version
    runs-on: ubuntu-latest
    needs: [resolve-tag]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: node scripts/check-version.mjs . "$RELEASE_TAG"

  # ── Cross-Platform Binaries ───────────────────────────────────────────────
  build-release-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check]
    if: >-
      ${{ !(inputs.dry_run == true) && !(github.event_name == 'workflow_dispatch' && inputs.skip_build) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: freebsd-amd64
            goos: freebsd
            goarch: amd64
            ext: ""
          - target: freebsd-arm64
            goos: freebsd
            goarch: arm64
            ext: ""
          - target: openbsd-amd64
            goos: openbsd
            goarch: amd64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true

      - uses: ./.github/actions/pnpm-install

      - name: Build web dist
        run: pnpm --filter @gospeak/web build

      - name: Embed frontend into server
        run: |
          rm -rf app/server/internal/webui/dist
          mkdir -p app/server/internal/webui/dist
          cp -R app/web/dist/. app/server/internal/webui/dist/
          test -f app/server/internal/webui/dist/index.html

      - name: Build binary
        working-directory: app/server
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          RELEASE_VERSION: ${{ needs.resolve-tag.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          go build \
            -ldflags="-s -w \
              -X 'GOSpeak/cmd.version=${RELEASE_VERSION}' \
              -X 'GOSpeak/cmd.commit=${RELEASE_COMMIT}'" \
            -o "gospeak-${{ matrix.target }}${{ matrix.ext }}" main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gospeak-${{ matrix.target }}
          path: app/server/gospeak-${{ matrix.target }}${{ matrix.ext }}
          retention-days: 14

      - name: Upload to release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          echo "Uploading to release $TAG..."
          gh release upload "$TAG" \
            "app/server/gospeak-${{ matrix.target }}${{ matrix.ext }}" --clobber

  # ── SHA256SUMS ──────────────────────────────────────────────────────────────
  checksums:
    name: Generate & Upload SHA256SUMS
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check, build-release-binaries]
    if: >-
      ${{ !(inputs.dry_run == true) && !(github.event_name == 'workflow_dispatch' && inputs.skip_build) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gospeak-*
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum gospeak-* > SHA256SUMS.txt
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "dist/SHA256SUMS.txt" --clobber
