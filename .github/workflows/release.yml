# GOSpeak Release CI —— 单一 Release，双组件产物同页发布。
#
# 版本号来源：.github/versions/server.yaml（服务端 + Web，作为发布版本）
# 与 .github/versions/desktop.yaml（桌面端）各自显式声明。合入 release 后由
# version-bump.yml 打 tag 并直接调用本 workflow；也可手动 dispatch 补跑。
#
# 只创建一个 GitHub Release，挂在服务端 tag（gospeak-server-v<version>）上，
# 标题为「GOSpeak v<version>」，Assets 同时包含服务端二进制与桌面端安装包：
#
#   服务端  gospeak-server-v<version>-<os>-<arch>[.exe]     10 个
#   桌面端  gospeak-desktop-v<version>-<os>-<arch>.<ext>    6 个 + install.sh
#   校验和  SHA256SUMS-gospeak-{server,desktop}-v<version>.txt
#
# gospeak-desktop-v* tag 仍会创建，只用于 changelog 基线，不单独建 Release。
#
# 正文结构见 scripts/release-notes.mjs：桌面端下载表格 → 服务端部署指引 →
# 服务端 release notes → 桌面端 release notes → 可折叠的提交记录。
#
# Docker 镜像由本 workflow 末尾调用 docker.yml 发布，不依赖 tag push 事件
# （GITHUB_TOKEN 推的 tag 不会派生 workflow）。
#
# workflow_dispatch 支持手动补跑（version 留空则读 server.yaml）。

name: Release

on:
  # tag push 仍保留：手工 `git push origin gospeak-server-v1.2.3` 可触发。
  # 但 version-bump.yml 用 GITHUB_TOKEN 推 tag 时 GitHub 会抑制派生 workflow，
  # 因此自动化路径是 version-bump 直接 workflow_call 调用本文件。
  push:
    tags: ["gospeak-server-v*"]
  workflow_call:
    inputs:
      version:
        description: "版本号（留空则读 .github/versions/server.yaml）"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (empty = 读 .github/versions/server.yaml)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Resolve Version（两个组件共用一个版本号）─────────────────────────
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      server_tag: ${{ steps.version.outputs.server_tag }}
      desktop_version: ${{ steps.version.outputs.desktop_version }}
      desktop_tag: ${{ steps.version.outputs.desktop_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          read_declared() {
            node -e '
              const { readFileSync } = require("node:fs");
              const src = readFileSync(process.argv[1], "utf8");
              const m = src.match(/^version:[ \t]*["'"'"']?([^\s#"'"'"']+)["'"'"']?[ \t]*(?:#.*)?$/m);
              if (m) console.log(m[1]);
            ' "$1"
          }

          server_version="$(read_declared .github/versions/server.yaml)"
          desktop_version="$(read_declared .github/versions/desktop.yaml)"
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            # 未显式传入时以服务端声明为发布版本；tag push 时取 tag 里的版本。
            if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [[ "${GITHUB_REF_NAME:-}" == gospeak-server-v* ]]; then
              version="$(node scripts/release-naming.mjs parse "$GITHUB_REF_NAME" | cut -d" " -f2)"
            else
              version="$server_version"
            fi
          fi
          if [ -z "$version" ]; then
            echo "::error::无法确定发布版本：.github/versions/server.yaml 缺少 version"
            exit 1
          fi

          server_tag="$(node scripts/release-naming.mjs tag server "$version")"
          desktop_tag="$(node scripts/release-naming.mjs tag desktop "$desktop_version")"

          {
            echo "version=$version"
            echo "server_tag=$server_tag"
            echo "desktop_version=$desktop_version"
            echo "desktop_tag=$desktop_tag"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::release version=${version} server_tag=${server_tag} desktop=${desktop_version}"

  version-check:
    name: Check Release Version (server + desktop)
    runs-on: ubuntu-latest
    needs: [resolve-version]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.server_tag }}
      - name: Validate release versions against declared yaml
        env:
          SERVER_TAG: ${{ needs.resolve-version.outputs.server_tag }}
          DESKTOP_TAG: ${{ needs.resolve-version.outputs.desktop_tag }}
        run: |
          set -euo pipefail
          node scripts/check-version.mjs . "$SERVER_TAG" server
          node scripts/check-version.mjs . "$DESKTOP_TAG" desktop

  # ── Create Release（单一 Release，挂在服务端 tag 上）─────────────────
  # 两个组件的产物都上传到同一个 Release：用户点一次就拿到服务端二进制与
  # 桌面端安装包，不必在两个 release 之间跳转。
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve-version, version-check]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.server_tag }}
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
      DESKTOP_VERSION: ${{ needs.resolve-version.outputs.desktop_version }}
    steps:
      # 刻意不 checkout 到 server_tag：正文由本 workflow 的 scripts/ 生成，
      # 补跑旧版本时 tag 指向的 commit 可能还没有新版本文渲染器。
      # 构建类 job 仍按 tag 检出，保证产物可复现。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Extract declared notes
        run: |
          set -euo pipefail
          # notes 取自版本声明 yaml 的 notes 字段（块标量 | 多行）；
          # 留空时该段退化为「本次发布无额外说明」。
          cat > /tmp/read-notes.mjs <<'EOF'
          import { readFileSync } from "node:fs";
          const src = readFileSync(process.argv[2], "utf8");
          const block = src.match(/^notes:[ \t]*\|\n((?:[ \t]*[^\n]*\n?)+)/m);
          if (block) {
            console.log(
              block[1].replace(/^[ \t]+/gm, "").replace(/^\n+|\n+$/g, ""),
            );
            process.exit(0);
          }
          const flow = src.match(/^notes:[ \t]*(?:"([^"]*)"|'([^']*)'|([^#\n]*))/m);
          const value = (flow ? (flow[1] ?? flow[2] ?? flow[3]) : "").trim();
          console.log(value);
          EOF
          node /tmp/read-notes.mjs .github/versions/server.yaml > /tmp/server-notes.md
          node /tmp/read-notes.mjs .github/versions/desktop.yaml > /tmp/desktop-notes.md

      - name: Build commit details block
        run: |
          set -euo pipefail
          # 以本组件上一个 tag 为基线生成「贡献者 + 提交明细」，输出为折叠块。
          # 基线取「本组件上一个已发布 tag」，与当前 checkout 的 revision 无关。
          prefix="$(node scripts/release-naming.mjs prefix server)"
          base="$(git for-each-ref --sort=-creatordate \
            --format='%(refname:short)' refs/tags \
            | grep -F "$prefix" | grep -Fvx "$RELEASE_TAG" | head -n1 || true)"
          if [ -n "$base" ]; then
            node scripts/build-changelog.mjs "$RELEASE_VERSION" "$base" \
              --no-write --exclude-ci --details-only > /tmp/details.md
          else
            : > /tmp/details.md
          fi
          echo "=== details block (head) ==="
          head -5 /tmp/details.md

      - name: Render release body
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs \
            --version "$RELEASE_VERSION" \
            --desktop-version "$DESKTOP_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --server-notes-file /tmp/server-notes.md \
            --desktop-notes-file /tmp/desktop-notes.md \
            --details-file /tmp/details.md \
            > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          echo "=== rendered release body (head) ==="
          head -20 /tmp/release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          # 已存在时只更新正文（补跑场景），不重建 release，避免资产被清空。
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; updating body only."
            gh release edit "$RELEASE_TAG" \
              --title "GOSpeak v${RELEASE_VERSION}" \
              --notes-file /tmp/release-notes.md
            exit 0
          fi
          release_args=(
            "$RELEASE_TAG"
            --target "$target_sha"
            --title "GOSpeak v${RELEASE_VERSION}"
            --notes-file /tmp/release-notes.md
          )
          # 预发布版本（含 - / + 的语义化版本）自动标记 prerelease
          if [[ "$RELEASE_VERSION" == *-* ]] || [[ "$RELEASE_VERSION" == *+* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "${release_args[@]}"

  # ── Build Web Once（服务端与桌面端共用同一份 desktop 目标产物）──────────
  # 合并发布后不再按组件二选一：统一用 GOSPEAK_TARGET=desktop 构建，
  # 桌面分支进包，服务端内嵌同一份前端（功能是超集）。
  build-web:
    name: Build Web Artifact
    runs-on: ubuntu-latest
    needs: [resolve-version, version-check]
    permissions:
      contents: read
    env:
      GOSPEAK_TARGET: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.server_tag }}

      - uses: ./.github/actions/pnpm-install

      - name: Build web dist
        run: pnpm --filter @gospeak/web build

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-web-dist
          path: app/web/dist
          retention-days: 3

  # ── 主体：Cross-Platform Server Binaries ────────────────────────────────
  build-release-binaries:
    name: Build server ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [resolve-version, version-check, create-release, build-web]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: freebsd-amd64
            goos: freebsd
            goarch: amd64
            ext: ""
          - target: freebsd-arm64
            goos: freebsd
            goarch: arm64
            ext: ""
          - target: openbsd-amd64
            goos: openbsd
            goarch: amd64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.server_tag }}

      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: release-web-dist
          path: app/web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true

      - name: Embed frontend into server
        run: |
          rm -rf app/server/internal/webui/dist
          mkdir -p app/server/internal/webui/dist
          cp -R app/web/dist/. app/server/internal/webui/dist/
          test -f app/server/internal/webui/dist/index.html

      - name: Resolve checked out commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve artifact name
        id: name
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          # 规范名由 release-naming.mjs 派生，workflow 里不手拼。
          # 用 matrix.target 而非 goos+goarch：linux-armv7 的 goarch 只是 arm，
          # 拼出来会丢 v7 版本位。
          echo "artifact=$(node scripts/release-naming.mjs artifact-target server "$VERSION" \
            '${{ matrix.target }}' '${{ matrix.ext }}')" >> "$GITHUB_OUTPUT"

      - name: Build binary
        working-directory: app/server
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          ARTIFACT: ${{ steps.name.outputs.artifact }}
        run: |
          go build \
            -ldflags="-s -w \
              -X 'GOSpeak/internal/buildinfo.Version=${RELEASE_VERSION}' \
              -X 'GOSpeak/internal/buildinfo.Commit=${RELEASE_COMMIT}'" \
            -o "$ARTIFACT" main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-server-${{ matrix.target }}
          path: app/server/${{ steps.name.outputs.artifact }}
          retention-days: 14

      - name: Upload to release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-version.outputs.server_tag }}
          ARTIFACT: ${{ steps.name.outputs.artifact }}
        run: |
          echo "Uploading to release $TAG..."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping upload."
            exit 0
          fi
          gh release upload "$TAG" "app/server/${ARTIFACT}" --clobber

  # ── 主体：SHA256SUMS ────────────────────────────────────────────────────
  checksums:
    name: Generate & Upload SHA256SUMS
    runs-on: ubuntu-latest
    needs: [resolve-version, version-check, create-release, build-release-binaries]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gospeak-server-*
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          # 文件名带组件与版本，服务端/桌面端产物不会互相覆盖或混淆。
          name="$(node "$GITHUB_WORKSPACE/scripts/release-naming.mjs" checksum server "$VERSION")"
          sha256sum gospeak-server-* > "$name"
          echo "=== $name ==="
          cat "$name"
          echo "checksum_file=$name" >> "$GITHUB_OUTPUT"
        id: sums

      - name: Upload SHA256SUMS to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-version.outputs.server_tag }}
          SUMS: ${{ steps.sums.outputs.checksum_file }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping SHA256SUMS upload."
            exit 0
          fi
          gh release upload "$TAG" "dist/${SUMS}" --clobber

  # ── 桌面端：Cross-Platform Desktop Binaries ─────────────────────────────
  # ── 桌面端：macOS 安装包（DMG，需要 macOS runner 的 hdiutil）──────────────
  build-desktop-macos:
    name: Build desktop macOS ${{ matrix.arch }}
    runs-on: macos-latest
    needs: [resolve-version, version-check, create-release, build-web]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            goarch: arm64
          - arch: amd64
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.desktop_tag }}

      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: release-web-dist
          path: app/web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/desktop/go.mod
          cache: true
          cache-dependency-path: app/desktop/go.sum

      # mygo 来自 app/desktop 的 devDependencies，必须装依赖才能调用
      - uses: ./.github/actions/pnpm-install

      - name: Embed frontend into desktop host
        run: |
          rm -rf app/desktop/webui/dist
          mkdir -p app/desktop/webui/dist
          cp -R app/web/dist/. app/desktop/webui/dist/
          test -f app/desktop/webui/dist/index.html

      - name: Resolve checked out commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # DMG 安装包：mygo build 产出 .app + dmg，Finder 里是「拖到 Applications」的
      # 标准安装体验。hdiutil 只有 macOS 有，所以这个作业跑在 macos runner 上。
      #
      # 版本号通过 MYGO_LDFLAGS 注入 main.version/main.commit（mygo 会把它们与
      # packageFlags 合并），保证 --version 与 tag 一致。
      - name: Build macOS app and DMG
        working-directory: app/desktop
        env:
          CGO_ENABLED: 0
          GOSPEAK_TARGET: desktop
          MYGO_LDFLAGS: >-
            -X 'main.version=${{ needs.resolve-version.outputs.desktop_version }}'
            -X 'main.commit=${{ steps.source.outputs.commit }}'
        run: |
          ./node_modules/.bin/mygo build \
            -skip-build-command \
            -platform "darwin/${{ matrix.goarch }}"

      # 用途说明缺失说明打包链路有问题：直接失败，不发一个麦克风不可用的包。
      - name: Verify bundle metadata
        working-directory: app/desktop
        run: |
          APP="$(find dist -maxdepth 2 -type d -name GOSpeak.app -print -quit)"
          test -n "$APP" -a -d "$APP"
          plutil -p "$APP/Contents/Info.plist" | grep -q NSMicrophoneUsageDescription
          plutil -p "$APP/Contents/Info.plist" | grep -q NSCameraUsageDescription
          DMG="$(find dist -maxdepth 2 -type f -name '*.dmg' -print -quit)"
          test -n "$DMG" -a -f "$DMG"
          # 挂载一次确认镜像可读且包含 .app 与 /Applications 链接。
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint /tmp/gospeak-dmg
          ls /tmp/gospeak-dmg/GOSpeak.app >/dev/null
          test -L /tmp/gospeak-dmg/Applications
          hdiutil detach /tmp/gospeak-dmg
          echo "DMG verified: $DMG"

      - name: Normalize artifact name
        id: name
        working-directory: app/desktop
        env:
          VERSION: ${{ needs.resolve-version.outputs.desktop_version }}
        run: |
          set -euo pipefail
          # mygo 产出的 dmg 名由 mygo.config.ts 的 version 决定，格式不受我们控制。
          # 这里统一重命名为 gospeak-desktop-v<ver>-darwin-<arch>.dmg，
          # 与服务端产物/tag 命名一一对应。
          src="$(find dist -maxdepth 2 -type f -name '*.dmg' -print -quit)"
          test -n "$src" -a -f "$src"
          out="$(node "$GITHUB_WORKSPACE/scripts/release-naming.mjs" artifact desktop "$VERSION" darwin '${{ matrix.arch }}' dmg)"
          cp "$src" "dist/$out"
          echo "artifact=$out" >> "$GITHUB_OUTPUT"
          echo "normalized: $src -> dist/$out"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-desktop-darwin-${{ matrix.arch }}
          path: app/desktop/dist/${{ steps.name.outputs.artifact }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-version.outputs.desktop_tag }}
          ARTIFACT: ${{ steps.name.outputs.artifact }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping upload."
            exit 0
          fi
          gh release upload "$TAG" "app/desktop/dist/${ARTIFACT}" --clobber

  # ── 桌面端：Linux / Windows 安装包 ──────────────────────────────────────
  build-desktop-others:
    name: Build desktop ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [resolve-version, version-check, create-release, build-web]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.desktop_tag }}

      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: release-web-dist
          path: app/web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/desktop/go.mod
          cache: true
          cache-dependency-path: app/desktop/go.sum

      # mygo 来自 app/desktop 的 devDependencies，必须装依赖才能调用
      - uses: ./.github/actions/pnpm-install

      - name: Embed frontend into desktop host
        run: |
          rm -rf app/desktop/webui/dist
          mkdir -p app/desktop/webui/dist
          cp -R app/web/dist/. app/desktop/webui/dist/
          test -f app/desktop/webui/dist/index.html

      - name: Resolve checked out commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # mygo 只在 Windows 上自动下载 NSIS；Linux runner 必须预装 makensis，
      # 否则它会跳过安装包只留下裸 exe（构建仍然"成功"，很容易漏掉）。
      - name: Install NSIS (Windows installer toolchain)
        if: matrix.goos == 'windows'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          makensis -VERSION

      # Linux 出 .deb（双击即装）+ tar.gz + install.sh（一键脚本）；
      # Windows 出 NSIS 安装包。两者都不需要宿主机是目标平台。
      - name: Build installers
        working-directory: app/desktop
        env:
          CGO_ENABLED: 0
          GOSPEAK_TARGET: desktop
          MYGO_LDFLAGS: >-
            -X 'main.version=${{ needs.resolve-version.outputs.desktop_version }}'
            -X 'main.commit=${{ steps.source.outputs.commit }}'
        run: |
          ./node_modules/.bin/mygo build \
            -skip-build-command \
            -platform "${{ matrix.goos }}/${{ matrix.goarch }}"

      # mygo 在 makensis 缺失时只打一条 warning 并继续，构建仍"成功"，
      # 产物里没有安装包。这里显式断言，避免静默发出裸 exe。
      - name: Verify installers were produced
        working-directory: app/desktop
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "${{ matrix.goos }}" = "windows" ]; then
            files=(dist/windows-*/*-setup-*.exe)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::No Windows installer produced (NSIS missing?)"
              ls -la dist/windows-*/ || true
              exit 1
            fi
            echo "Windows installer: ${files[0]}"
          else
            debs=(dist/linux-*/*.deb)
            tarballs=(dist/linux-*/*.tar.gz)
            if [ ${#debs[@]} -eq 0 ] || [ ${#tarballs[@]} -eq 0 ]; then
              echo "::error::Missing Linux packages (.deb / .tar.gz)"
              ls -la dist/linux-*/ || true
              exit 1
            fi
            echo "Linux packages: ${debs[0]}, ${tarballs[0]}"
          fi

      - name: Normalize artifact names
        id: name
        working-directory: app/desktop
        env:
          VERSION: ${{ needs.resolve-version.outputs.desktop_version }}
          GOOS: ${{ matrix.goos }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # 统一成 gospeak-desktop-v<ver>-<os>-<arch>.<ext>；install.sh 保持原名
          # （它是脚本而非二进制产物，改名会破坏文档里的安装指引）。
          naming="$GITHUB_WORKSPACE/scripts/release-naming.mjs"
          shopt -s nullglob
          files=()
          for src in dist/"${GOOS}"-*/*.deb dist/"${GOOS}"-*/*.tar.gz dist/"${GOOS}"-*/*-setup-*.exe; do
            case "$src" in
              *.deb)     ext=deb ;;
              *.tar.gz)  ext=tar.gz ;;
              *.exe)     ext=exe ;;
              *)         continue ;;
            esac
            out="$(node "$naming" artifact-target desktop "$VERSION" "$TARGET" "$ext")"
            cp "$src" "dist/$out"
            files+=("$out")
            echo "normalized: $src -> dist/$out"
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No packages to normalize"
            exit 1
          fi
          printf '%s\n' "${files[@]}" > /tmp/normalized.txt
          cat /tmp/normalized.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-desktop-${{ matrix.target }}
          path: |
            app/desktop/dist/gospeak-desktop-v*
            app/desktop/dist/${{ matrix.goos }}-*/install.sh
          if-no-files-found: error
          retention-days: 14

      - name: Upload to release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-version.outputs.desktop_tag }}
          GOOS: ${{ matrix.goos }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping upload."
            exit 0
          fi
          shopt -s nullglob
          for f in app/desktop/dist/gospeak-desktop-v* \
                   app/desktop/dist/"${GOOS}"-*/install.sh; do
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done

  desktop-checksums:
    name: Generate & Upload desktop SHA256SUMS
    runs-on: ubuntu-latest
    needs: [resolve-version, version-check, create-release, build-desktop-macos, build-desktop-others]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gospeak-desktop-*
          path: dist/
          merge-multiple: true

      - name: Generate desktop SHA256SUMS
        id: sums
        working-directory: dist
        env:
          VERSION: ${{ needs.resolve-version.outputs.desktop_version }}
        run: |
          set -euo pipefail
          # 产物是 dmg / deb / tar.gz / setup.exe / install.sh，名字各不相同，
          # 逐个列出而不是靠前缀通配。
          #
          # 注意：install.sh 是字面文件名而不是 glob，nullglob 对它无效——
          # 文件不存在时它仍会留在数组里，导致 sha256sum 报
          # "install.sh: No such file or directory"。所以单独判断存在性再追加。
          shopt -s nullglob
          files=(*.dmg *.deb *.tar.gz *.exe)
          for f in install.sh; do
            [ -f "$f" ] && files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No desktop artifacts found to checksum"
            ls -la
            exit 1
          fi
          name="$(node "$GITHUB_WORKSPACE/scripts/release-naming.mjs" checksum desktop "$VERSION")"
          sha256sum "${files[@]}" | sort -k2 > "$name"
          echo "=== $name ==="
          cat "$name"
          echo "checksum_file=$name" >> "$GITHUB_OUTPUT"

      - name: Upload desktop SHA256SUMS to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-version.outputs.desktop_tag }}
          SUMS: ${{ steps.sums.outputs.checksum_file }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping SHA256SUMS upload."
            exit 0
          fi
          gh release upload "$TAG" "dist/${SUMS}" --clobber

  # ── Docker 镜像（与服务端 tag 同步发布）────────────────────────────────
  # 原先由 docker.yml 的 `on: push: tags` 触发，但 version-bump 用 GITHUB_TOKEN
  # 推 tag 时 GitHub 会抑制派生 workflow，镜像会漏发。改为在本链路内显式调用。
  publish-image:
    name: Publish Docker Image
    needs: [resolve-version, version-check, create-release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
    secrets: inherit

  # ── 完成汇总 ────────────────────────────────────────────────────────────
  release-summary:
    name: Release Summary
    if: always()
    needs:
      - resolve-version
      - create-release
      - build-release-binaries
      - checksums
      - build-desktop-macos
      - build-desktop-others
      - desktop-checksums
      - publish-image
    runs-on: ubuntu-latest
    steps:
      - name: Verify all release jobs succeeded
        env:
          RELEASE_TAG: ${{ needs.resolve-version.outputs.server_tag }}
          SERVER_BUILD: ${{ needs.build-release-binaries.result }}
          SERVER_SUMS: ${{ needs.checksums.result }}
          DESKTOP_MACOS: ${{ needs.build-desktop-macos.result }}
          DESKTOP_OTHERS: ${{ needs.build-desktop-others.result }}
          DESKTOP_SUMS: ${{ needs.desktop-checksums.result }}
          IMAGE: ${{ needs.publish-image.result }}
        run: |
          set -euo pipefail
          failed=0
          # skipped 不算失败：create-release 失败或流程提前中止时，下游 job 会被
          # 跳过，这里只报真正失败的 job，避免一次故障刷出一片假错误。
          check() {
            case "$2" in
              success|skipped) ;;
              *)
                echo "::error::$1 ended with $2"
                failed=1
                ;;
            esac
          }
          check "server binaries" "$SERVER_BUILD"
          check "server checksums" "$SERVER_SUMS"
          check "desktop macOS" "$DESKTOP_MACOS"
          check "desktop linux/windows" "$DESKTOP_OTHERS"
          check "desktop checksums" "$DESKTOP_SUMS"
          check "docker image" "$IMAGE"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          {
            echo "## GOSpeak Release"
            echo ""
            echo "Release: \`${RELEASE_TAG}\`"
            echo ""
            echo "| 产物 | 结果 |"
            echo "| --- | --- |"
            echo "| 服务端二进制 | $SERVER_BUILD |"
            echo "| 服务端 SHA256SUMS | $SERVER_SUMS |"
            echo "| 桌面端 macOS | $DESKTOP_MACOS |"
            echo "| 桌面端 Linux / Windows | $DESKTOP_OTHERS |"
            echo "| 桌面端 SHA256SUMS | $DESKTOP_SUMS |"
            echo "| Docker 镜像 | $IMAGE |"
          } >> "$GITHUB_STEP_SUMMARY"
