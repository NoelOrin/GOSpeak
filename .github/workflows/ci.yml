# GOSpeak CI
# 触发: release 发布 (published) | 手动

name: CI

on:
  pull_request:
    branches: [release, dev, main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run server tests (Go)"
        required: false
        default: true
        type: boolean
      release_build:
        description: "Build cross-platform release binaries"
        required: false
        default: true
        type: boolean

jobs:
  # ── Backend: Build Go Server ─────────────────────────────────────────
  build-server:
    name: Build Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum

      - name: Install CGO deps
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev

      - name: Build
        working-directory: app/server
        env:
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w" -o gospeak-server .

      - name: Upload binary
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: gospeak-server
          path: app/server/gospeak-server
          retention-days: 3

  # ── Backend: Test Go Server ──────────────────────────────────────────
  test-server:
    name: Test Server (Go)
    runs-on: ubuntu-latest
    needs: build-server
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' && inputs.run_tests || github.event_name != 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum

      - name: Install CGO deps
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev

      - name: Test
        working-directory: app/server
        env:
          CGO_ENABLED: 1
        run: go test ./... -v -count=1

  # ── JS Deps: Shared Install Layer ────────────────────────────────────
  js-deps:
    name: Install JS Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        # version 由 package.json 的 packageManager 字段自动获取

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Cache pnpm store
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            node_modules
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install all deps
        run: pnpm install --frozen-lockfile

  # ── Frontend Web: Build ──────────────────────────────────────────────
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: js-deps
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        # version 由 package.json 的 packageManager 字段自动获取

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Restore pnpm cache
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            node_modules
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install offline
        run: pnpm install --frozen-lockfile --offline || pnpm install --frozen-lockfile

      - name: Build
        working-directory: app/web
        run: pnpm build

      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: app/web/dist
          retention-days: 3

  # ── SFU Client: Build ────────────────────────────────────────────────
  build-sfu-client:
    name: Build SFU Client
    runs-on: ubuntu-latest
    needs: js-deps
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        # version 由 package.json 的 packageManager 字段自动获取

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Restore pnpm cache
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            node_modules
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install offline
        run: pnpm install --frozen-lockfile --offline || pnpm install --frozen-lockfile

      - name: Build
        working-directory: packages/sfu-client
        run: pnpm build

  # ── Mediasoup Worker: Build ──────────────────────────────────────────
  build-mediasoup-worker:
    name: Build MediaSoup Worker
    runs-on: ubuntu-latest
    needs: js-deps
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        # version 由 package.json 的 packageManager 字段自动获取

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Restore pnpm cache
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            node_modules
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install offline
        run: pnpm install --frozen-lockfile --offline || pnpm install --frozen-lockfile

      - name: Build
        working-directory: packages/mediasoup-worker
        run: pnpm build

  # ── Frontend Web: Lint & Check ───────────────────────────────────────
  lint-web:
    name: Lint Web (Biome)
    runs-on: ubuntu-latest
    needs: js-deps
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        # version 由 package.json 的 packageManager 字段自动获取

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Restore pnpm cache
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            node_modules
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install offline
        run: pnpm install --frozen-lockfile --offline || pnpm install --frozen-lockfile

      - name: Lint
        working-directory: app/web
        run: pnpm lint

      - name: Check
        working-directory: app/web
        run: pnpm check

  # ── Docker: Build & Push Image (release only) ──────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    # Dockerfile 本身是多阶段构建 (Go + Web)，不依赖其他 job
    if: ${{ github.event_name == 'release' }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      # -- 登录 GitHub Container Registry --
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -- 提取镜像元数据 (标签/注解) --
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ── Release: Cross-Platform Binary ───────────────────────────────────
  build-release-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_build) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            runner: ubuntu-latest
            cc_pkg: ""
            cc: ""
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cc_pkg: gcc-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            runner: macos-13
            cc_pkg: ""
            cc: ""
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            runner: macos-latest
            cc_pkg: ""
            cc: ""
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            runner: ubuntu-latest
            cc_pkg: gcc-mingw-w64-x86-64
            cc: x86_64-w64-mingw32-gcc
            ext: ".exe"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod

      - name: Install cross-compiler
        if: matrix.cc_pkg != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cc_pkg }} libsqlite3-dev

      - name: Build binary
        working-directory: app/server
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          go build -ldflags="-s -w" -o "gospeak-server-${{ matrix.target }}${{ matrix.ext }}" main.go

      - name: Package (tar.gz)
        if: matrix.goos != 'windows'
        run: |
          cd app/server
          tar czf "gospeak-server-${{ matrix.target }}.tar.gz" "gospeak-server-${{ matrix.target }}"

      - name: Package (zip)
        if: matrix.goos == 'windows'
        run: |
          cd app/server
          zip "gospeak-server-windows-amd64.zip" "gospeak-server-windows-amd64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: gospeak-server-${{ matrix.target }}
          path: app/server/gospeak-server-${{ matrix.target }}.*
          retention-days: 14

      - name: Upload to release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in app/server/gospeak-server-${{ matrix.target }}.*; do
            [ -f "$f" ] || continue
            echo "Uploading $f to release ${{ github.event.release.tag_name }}..."
            gh release upload "${{ github.event.release.tag_name }}" "$f" --clobber
          done

      - name: Verify binary
        if: matrix.goos != 'windows'
        run: |
          file app/server/gospeak-server-${{ matrix.target }}

      - name: Verify binary (windows)
        if: matrix.goos == 'windows'
        run: |
          file app/server/gospeak-server-windows-amd64.exe
