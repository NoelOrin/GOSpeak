# GOSpeak CI
# 触发: release 发布 (published) | 手动

name: CI

on:
  pull_request:
    branches: [release, dev, main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run server tests (Go)"
        required: false
        default: true
        type: boolean
      release_build:
        description: "Build cross-platform release binaries"
        required: false
        default: true
        type: boolean
# 同一时间只允许一个 CI 运行；PR 反复 push 时取消旧运行，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: Build Go Server ─────────────────────────────────────────
  build-server:
    name: Build Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true

      - name: Build
        working-directory: app/server
        env:
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o gospeak .

      - name: Upload binary
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: gospeak
          path: app/server/gospeak
          retention-days: 3

  # ── Backend: Test Go Server ──────────────────────────────────────────
  test-server:
    name: Test Server (Go)
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_tests) || (github.event_name != 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true

      - name: Test
        working-directory: app/server
        env:
          CGO_ENABLED: 0
        run: go test ./... -v -count=1

  # ── Frontend Web: Build ──────────────────────────────────────────────
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pnpm-install

      - name: Build
        working-directory: app/web
        run: pnpm build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: app/web/dist
          retention-days: 3

  # ── SFU Client: Build ────────────────────────────────────────────────
  build-sfu-client:
    name: Build SFU Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pnpm-install

      - name: Build
        working-directory: packages/sfu-client
        run: pnpm build

  # ── Mediasoup Worker: Build ──────────────────────────────────────────
  build-mediasoup-worker:
    name: Build MediaSoup Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pnpm-install

      - name: Build
        working-directory: packages/mediasoup-worker
        run: pnpm build

  # ── Frontend Web: Lint & Check ───────────────────────────────────────
  lint-web:
    name: Lint Web (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pnpm-install

      - name: Lint
        working-directory: app/web
        run: pnpm lint

      - name: Check
        working-directory: app/web
        run: pnpm check

  # ── Docker: Build & Push Image (release only) ──────────────────────
  # Dockerfile 内部构建前端并 go:embed 进二进制，不再依赖外部 web-dist artifact
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # -- 登录 GitHub Container Registry --
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -- 提取镜像元数据 (标签/注解) --
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ── Release: Cross-Platform Binary (frontend embedded) ───────────────
  # 每个平台产物是单文件二进制：前端经 go:embed 打进 server，无需再附 static/ 压缩包。
  build-release-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: build-web
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_build) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # CGO_ENABLED=0 pure-Go cross-compile on Linux — no macOS runners needed.
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: freebsd-amd64
            goos: freebsd
            goarch: amd64
            ext: ""
          - target: freebsd-arm64
            goos: freebsd
            goarch: arm64
            ext: ""
          - target: openbsd-amd64
            goos: openbsd
            goarch: amd64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true

      - name: Download web dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: app/web/dist

      - name: Embed frontend into server
        run: |
          rm -rf app/server/internal/webui/dist
          mkdir -p app/server/internal/webui/dist
          cp -R app/web/dist/. app/server/internal/webui/dist/
          test -f app/server/internal/webui/dist/index.html

      - name: Build binary
        working-directory: app/server
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -ldflags="-s -w" -o "gospeak-${{ matrix.target }}${{ matrix.ext }}" main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-${{ matrix.target }}
          path: app/server/gospeak-${{ matrix.target }}${{ matrix.ext }}
          retention-days: 14

      - name: Upload to release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="app/server/gospeak-${{ matrix.target }}${{ matrix.ext }}"
          echo "Uploading $f to release ${{ github.event.release.tag_name }}..."
          gh release upload "${{ github.event.release.tag_name }}" "$f" --clobber

      - name: Verify binary
        if: matrix.goos != 'windows'
        run: |
          file app/server/gospeak-${{ matrix.target }}
          # 粗略确认前端被嵌入（index.html 字符串应存在于二进制中）
          strings app/server/gospeak-${{ matrix.target }} | grep -q '<!DOCTYPE html>' || \
            strings app/server/gospeak-${{ matrix.target }} | grep -q 'index.html' || \
            echo "WARN: could not confirm embedded HTML via strings"

      - name: Verify binary (windows)
        if: matrix.goos == 'windows'
        run: |
          f="${{ matrix.target }}"
          file "app/server/gospeak-${f}.exe"
