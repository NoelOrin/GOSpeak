# GOSpeak CI
# 触发: push 到 dev/master/release/* | PR 到 dev/master | 手动

name: CI

on:
  push:
    branches: [dev, master, 'release/**']
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run server tests (Go)"
        required: false
        default: true
        type: boolean
      release_build:
        description: "Build cross-platform release binaries"
        required: false
        default: false
        type: boolean

jobs:

  # ── Backend: Build Go Server ─────────────────────────────────────────
  build-server:
    name: Build Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum

      - name: Install CGO deps
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev

      - name: Build
        working-directory: app/server
        env:
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w" -o gospeak-server .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gospeak-server
          path: app/server/gospeak-server
          retention-days: 3

  # ── Backend: Test Go Server ──────────────────────────────────────────
  test-server:
    name: Test Server (Go)
    runs-on: ubuntu-latest
    needs: build-server
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' && inputs.run_tests || github.event_name != 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum

      - name: Install CGO deps
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev

      - name: Test
        working-directory: app/server
        env:
          CGO_ENABLED: 1
        run: go test ./... -v -count=1

  # ── JS Deps: Shared Install Layer ────────────────────────────────────
  js-deps:
    name: Install JS Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache pnpm store
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            node_modules
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install all deps
        run: pnpm install --frozen-lockfile

  # ── Frontend Web: Build ──────────────────────────────────────────────
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: js-deps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Restore pnpm cache
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            node_modules
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install offine
        run: pnpm install --frozen-lockfile --offline || pnpm install --frozen-lockfile

      - name: Build
        working-directory: app/web
        run: pnpm build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/web/dist
          retention-days: 3

  # ── SFU Client: Build ────────────────────────────────────────────────
  build-sfu-client:
    name: Build SFU Client
    runs-on: ubuntu-latest
    needs: js-deps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Restore pnpm cache
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            node_modules
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install offine
        run: pnpm install --frozen-lockfile --offline || pnpm install --frozen-lockfile

      - name: Build
        working-directory: packages/sfu-client
        run: pnpm build

  # ── Mediasoup Worker: Build ──────────────────────────────────────────
  build-mediasoup-worker:
    name: Build MediaSoup Worker
    runs-on: ubuntu-latest
    needs: js-deps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Restore pnpm cache
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            node_modules
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install offine
        run: pnpm install --frozen-lockfile --offline || pnpm install --frozen-lockfile

      - name: Build
        working-directory: packages/mediasoup-worker
        run: pnpm build

  # ── Frontend Web: Lint & Check ───────────────────────────────────────
  lint-web:
    name: Lint Web (Biome)
    runs-on: ubuntu-latest
    needs: js-deps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Restore pnpm cache
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            node_modules
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install offine
        run: pnpm install --frozen-lockfile --offline || pnpm install --frozen-lockfile

      - name: Lint
        working-directory: app/web
        run: pnpm lint

      - name: Check
        working-directory: app/web
        run: pnpm check

  # ── Docker: Build Image (push only, skip PRs) ────────────────────────
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-server, build-web]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: gospeak-server
          path: app/server/

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/web/dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: gospeak:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Release: Cross-Platform Binary ───────────────────────────────────
  build-release-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')) || (github.event_name == 'workflow_dispatch' && inputs.release_build) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            runner: ubuntu-latest
            cc_pkg: ""
            cc: ""
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cc_pkg: gcc-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            runner: macos-13
            cc_pkg: ""
            cc: ""
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            runner: macos-latest
            cc_pkg: ""
            cc: ""
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            runner: ubuntu-latest
            cc_pkg: gcc-mingw-w64-x86-64
            cc: x86_64-w64-mingw32-gcc
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/server/go.mod

      - name: Install cross-compiler
        if: matrix.cc_pkg != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cc_pkg }} libsqlite3-dev

      - name: Build binary
        working-directory: app/server
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          go build -ldflags="-s -w" -o "gospeak-server-${{ matrix.target }}${{ matrix.ext }}" main.go

      - name: Package (tar.gz)
        if: matrix.goos != 'windows'
        run: |
          cd app/server
          tar czf "gospeak-server-${{ matrix.target }}.tar.gz" "gospeak-server-${{ matrix.target }}"

      - name: Package (zip)
        if: matrix.goos == 'windows'
        run: |
          cd app/server
          zip "gospeak-server-windows-amd64.zip" "gospeak-server-windows-amd64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gospeak-server-${{ matrix.target }}
          path: app/server/gospeak-server-${{ matrix.target }}.*
          retention-days: 14

      - name: Verify binary
        if: matrix.goos != 'windows'
        run: |
          file app/server/gospeak-server-${{ matrix.target }}

      - name: Verify binary (windows)
        if: matrix.goos == 'windows'
        run: |
          file app/server/gospeak-server-windows-amd64.exe
