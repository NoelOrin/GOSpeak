# GOSpeak CI
# 触发: release 发布 (published) | 手动

name: CI

on:
  pull_request:
    branches: [release, dev, main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run server tests (Go)"
        required: false
        default: true
        type: boolean
      release_build:
        description: "Build cross-platform release binaries"
        required: false
        default: true
        type: boolean
# 同一时间只允许一个 CI 运行；PR 反复 push 时取消旧运行，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: Build Go Server ─────────────────────────────────────────
  build-server:
    name: Build Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true

      - name: Build
        working-directory: app/server
        env:
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o gospeak-server .

      - name: Upload binary
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-server
          path: app/server/gospeak-server
          retention-days: 3

  # ── Backend: Test Go Server ──────────────────────────────────────────
  test-server:
    name: Test Server (Go)
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_tests) || (github.event_name != 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true

      - name: Test
        working-directory: app/server
        env:
          CGO_ENABLED: 0
        run: go test ./... -v -count=1

  # ── Frontend Web: Build ──────────────────────────────────────────────
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pnpm-install

      - name: Build
        working-directory: app/web
        run: pnpm build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: app/web/dist
          retention-days: 3

  # ── SFU Client: Build ────────────────────────────────────────────────
  build-sfu-client:
    name: Build SFU Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pnpm-install

      - name: Build
        working-directory: packages/sfu-client
        run: pnpm build

  # ── Mediasoup Worker: Build ──────────────────────────────────────────
  build-mediasoup-worker:
    name: Build MediaSoup Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pnpm-install

      - name: Build
        working-directory: packages/mediasoup-worker
        run: pnpm build

  # ── Frontend Web: Lint & Check ───────────────────────────────────────
  lint-web:
    name: Lint Web (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pnpm-install

      - name: Lint
        working-directory: app/web
        run: pnpm lint

      - name: Check
        working-directory: app/web
        run: pnpm check

  # ── Docker: Build & Push Image (release only) ──────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    # 复用 build-web 预构建的 web-dist，避免重复构建前端
    needs: build-web
    if: ${{ github.event_name == 'release' }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download web dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: app/web/dist

      # -- 登录 GitHub Container Registry --
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -- 提取镜像元数据 (标签/注解) --
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ── Release: Cross-Platform Binary ───────────────────────────────────
  build-release-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_build) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            runner: ubuntu-latest
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            runner: macos-13
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            runner: macos-latest
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            runner: ubuntu-latest
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true

      - name: Build binary
        working-directory: app/server
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" -o "gospeak-server-${{ matrix.target }}${{ matrix.ext }}" main.go

      - name: Package (tar.gz)
        if: matrix.goos != 'windows'
        run: |
          cd app/server
          tar czf "gospeak-server-${{ matrix.target }}.tar.gz" "gospeak-server-${{ matrix.target }}"

      - name: Package (zip)
        if: matrix.goos == 'windows'
        run: |
          cd app/server
          zip "gospeak-server-windows-amd64.zip" "gospeak-server-windows-amd64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-server-${{ matrix.target }}
          path: app/server/gospeak-server-${{ matrix.target }}.*
          retention-days: 14

      - name: Upload to release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in app/server/gospeak-server-${{ matrix.target }}.*; do
            [ -f "$f" ] || continue
            echo "Uploading $f to release ${{ github.event.release.tag_name }}..."
            gh release upload "${{ github.event.release.tag_name }}" "$f" --clobber
          done

      - name: Verify binary
        if: matrix.goos != 'windows'
        run: |
          file app/server/gospeak-server-${{ matrix.target }}

      - name: Verify binary (windows)
        if: matrix.goos == 'windows'
        run: |
          file app/server/gospeak-server-windows-amd64.exe
