# GOSpeak CI — 质量门禁（按路径精准触发，聚合 JS 构建）
# 由原 build.yml 重做而来，对外仍暴露 workflow_call 供 release 复用。
name: CI

on:
  pull_request:
    branches: [release, dev, main, master]
  push:
    branches: [release, dev]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run server tests (Go)"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      run_tests:
        description: "Run server tests (Go)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      js: ${{ steps.filter.outputs.js }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'app/server/**'
              - 'app/server/go.mod'
              - 'app/server/go.sum'
            js:
              - 'app/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            docs:
              - 'docs/**'
              - '**/*.md'
              - 'app/docs/**'

  lint:
    name: Lint (Biome + go vet)
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-install
      - name: Biome CI
        run: npx @biomejs/biome ci --files-ignore-unknown=true ./app/web ./packages
      - name: Biome Check
        run: npx @biomejs/biome check --files-ignore-unknown=true ./app/web ./packages || true
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true
      - name: Vet
        run: cd app/server && go vet ./...

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-install
      - name: Typecheck
        run: pnpm typecheck

  build-js:
    name: Build JS (turbo)
    needs: changes
    if: needs.changes.outputs.js == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-install
      - name: Build JS
        run: pnpm turbo run build --filter=@gospeak/web --filter=@gospeak/sfu-client --filter=@gospeak/mediasoup-worker
      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/web/dist
          retention-days: 3

  build-server:
    name: Build Server (Go)
    needs: [changes, build-js]
    if: >-
      ${{ !cancelled() && (needs.changes.outputs.go == 'true' || needs.changes.outputs.js == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/web/dist
      - name: Embed frontend into server
        run: |
          rm -rf app/server/internal/webui/dist
          mkdir -p app/server/internal/webui/dist
          cp -R app/web/dist/. app/server/internal/webui/dist/
          test -f app/server/internal/webui/dist/index.html
      - name: Build
        working-directory: app/server
        env:
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o gospeak .

  test-server:
    name: Test Server (Go)
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.go == 'true' &&
          (github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call' || inputs.run_tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true
      - name: Test
        working-directory: app/server
        env:
          CGO_ENABLED: 1
        run: go test ./... -race -v -count=1
