# GOSpeak Build CI
# 质量门禁：PR / push 触发构建、lint、test；并暴露 workflow_call 供 release 复用。
name: Build

on:
  pull_request:
    branches: [release, dev, main, master]
  push:
    branches: [release, dev]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run server tests (Go)"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      run_tests:
        description: "Run server tests (Go)"
        required: false
        default: true
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install
      - name: Build
        working-directory: app/web
        run: pnpm build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: app/web/dist
          retention-days: 3

  build-sfu-client:
    name: Build SFU Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install
      - name: Build
        working-directory: packages/sfu-client
        run: pnpm build

  build-mediasoup-worker:
    name: Build MediaSoup Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install
      - name: Build
        working-directory: packages/mediasoup-worker
        run: pnpm build

  lint-web:
    name: Lint Web (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install
      - name: Lint
        working-directory: app/web
        run: pnpm lint
      - name: Check
        working-directory: app/web
        run: pnpm check

  build-server:
    name: Build Server (Go)
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true
      - name: Download web dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: app/web/dist
      - name: Embed frontend into server
        run: |
          rm -rf app/server/internal/webui/dist
          mkdir -p app/server/internal/webui/dist
          cp -R app/web/dist/. app/server/internal/webui/dist/
          test -f app/server/internal/webui/dist/index.html
      - name: Build
        working-directory: app/server
        env:
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o gospeak .

  lint-server:
    name: Lint Server (go vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true
      - name: Vet
        working-directory: app/server
        run: go vet ./...

  test-server:
    name: Test Server (Go)
    runs-on: ubuntu-latest
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.run_tests) ||
          (github.event_name == 'workflow_call' && inputs.run_tests) ||
          (github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true
      - name: Test
        working-directory: app/server
        env:
          CGO_ENABLED: 1
        run: go test ./... -race -v -count=1
