name: Docker

on:
  pull_request:
    branches: [release, dev]
    paths-ignore:
      - "docs/**"
      - "app/docs/**"
      - "**/*.md"
  push:
    tags: ["gospeak-server-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build Image
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check product version
        run: node scripts/check-version.mjs . "" server
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: gospeak:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish Image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gospeak-server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.mjs . "$RELEASE_TAG" server
      - name: Resolve image version
        id: version
        # tag 形如 gospeak-server-v1.2.3，镜像 tag 只要 1.2.3，
        # 因此走 release-naming.mjs 解析而不是字符串裁剪。
        run: |
          set -euo pipefail
          parsed="$(node scripts/release-naming.mjs parse "$GITHUB_REF_NAME")"
          echo "version=${parsed##* }" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-') }}
            type=sha,prefix=
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
