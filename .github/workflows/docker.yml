name: Docker

on:
  pull_request:
    branches: [release, dev]
    paths-ignore:
      - "docs/**"
      - "app/docs/**"
      - "**/*.md"
  # 手工推 tag 时仍可直接触发（镜像与 release 并行发布）。
  push:
    tags: ["gospeak-server-v*"]
  # 自动化路径：release.yml 在发布链末尾显式调用，避免依赖 tag push 派生事件
  # —— version-bump.yml 用 GITHUB_TOKEN 推 tag，GitHub 会抑制派生 workflow。
  workflow_call:
    inputs:
      version:
        description: "镜像版本（留空则按当前 ref/声明版本解析）"
        required: false
        default: ""
        type: string
      publish:
        description: "是否推送镜像到 GHCR"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本（留空则按声明版本解析）"
        required: false
        default: ""
        type: string
      publish:
        description: "是否推送镜像到 GHCR"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build Image
    # reusable workflow 里 github.event_name 是调用方的事件名（不是 workflow_call），
    # 因此这里不能靠事件名判断，改为「只要本次不推送镜像就做一次构建校验」。
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check product version
        run: node scripts/check-version.mjs . "" server
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: gospeak:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish Image
    # 两条路径：调用方显式要求推送（release.yml），或手工推了服务端 tag。
    # 不能用 github.event_name == 'workflow_call'：reusable workflow 里它是调用方
    # 的事件名（push / workflow_dispatch），条件永远不成立，镜像会被静默跳过。
    if: >-
      inputs.publish ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gospeak-server-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        # workflow_call 时没有触发 tag，显式传空让脚本走「声明版本一致性」校验，
        # 而不是拿分支名当 tag 导致假阳性。
        run: node scripts/check-version.mjs . "$RELEASE_TAG" server
      - name: Resolve image version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        # 三种来源，优先级从高到低：
        #   1. workflow_call / workflow_dispatch 显式传入的 version
        #   2. tag push：tag 形如 gospeak-server-v1.2.3，镜像 tag 只要 1.2.3，
        #      因此走 release-naming.mjs 解析而不是字符串裁剪
        #   3. 兜底：读 .github/versions/server.yaml 的声明版本
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            if [[ "${GITHUB_REF:-}" == refs/tags/gospeak-server-v* ]]; then
              parsed="$(node scripts/release-naming.mjs parse "$GITHUB_REF_NAME")"
              version="${parsed##* }"
            else
              version="$(node -e '
                const { readFileSync } = require("node:fs");
                const src = readFileSync(".github/versions/server.yaml", "utf8");
                const m = src.match(/^version:[ \t]*["'"'"']?([^\s#"'"'"']+)["'"'"']?[ \t]*(?:#.*)?$/m);
                if (m) console.log(m[1]);
              ')"
            fi
          fi
          if [ -z "$version" ]; then
            echo "::error::无法确定镜像版本"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::image version=${version}"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-') }}
            type=sha,prefix=
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
