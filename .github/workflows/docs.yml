# GOSpeak Docs — VitePress 构建与部署
#
# 构建文档站并可选部署到 GitHub Pages。
#
# 触发:
#   - push 到 release / feature/** 且含 docs 变更
#   - release 发布 (published / edited)
#   - workflow_dispatch 手动

name: Docs

on:
  push:
    branches: [release, feature/**]
    paths:
      - "app/docs/**"
      - "packages/sfu-client/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"

  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages"
        required: false
        default: false
        type: boolean

# 同一时间只允许一个部署
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 构建 ──────────────────────────────────────────────────────────────
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # version 由 package.json 的 packageManager 字段自动获取

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache pnpm store
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            node_modules
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VitePress
        env:
          NODE_ENV: production
        run: pnpm --filter @gospeak/docs build

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/docs/.vitepress/dist

  # ── 部署到 GitHub Pages ──────────────────────────────────────────────
  # push / PR / release 自动部署，手动触发需勾选 deploy
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.ref_type != 'tag' || (
        !contains(github.ref_name, '-alpha') &&
        !contains(github.ref_name, '-beta') &&
        !contains(github.ref_name, '-rc')
      )) && (
        github.event_name != 'workflow_dispatch' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy)
      )
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
