name: pnpm install
description: Setup pnpm + Node.js and install workspace dependencies with caching
inputs:
  install:
    description: Install workspace dependencies after setting up pnpm and Node.js
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
