pre-commit:
  parallel: true
  commands:
    "biome check":
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    "go vet":
      glob: "app/server/**/*.go"
      run: cd app/server && go vet ./...

commit-msg:
  commands:
    "commitlint":
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    "biome ci":
      run: npx @biomejs/biome ci --files-ignore-unknown=true ./app/web ./packages ./scripts ./test ./app/desktop
    "hook dependency ratchet":
      # biome 的 useExhaustiveDependencies 是 warn，biome ci 不会因此失败；
      # 棘轮脚本阻止新增告警，与 CI 的 lint job 使用同一基线。
      run: node scripts/check-hook-deps.mjs
    "go vet":
      run: cd app/server && go vet ./...
    "radius tokens":
      run: node scripts/check-radius-tokens.mjs
    "desktop bridge contract":
      run: node scripts/check-desktop-commands.mjs
    "typecheck":
      run: pnpm typecheck
