pre-commit:
  parallel: true
  commands:
    "biome check":
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    "go vet":
      glob: "app/server/**/*.go"
      run: cd app/server && go vet ./...

commit-msg:
  commands:
    "commitlint":
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    "biome ci":
      run: npx @biomejs/biome ci --files-ignore-unknown=true ./app/web ./packages
    "go vet":
      run: cd app/server && go vet ./...
    "typecheck":
      run: pnpm typecheck
    "go test":
      run: cd app/server && go test ./... -count=1
