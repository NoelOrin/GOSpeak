basePath: /api/v1
definitions:
  handler.JoinRoomRequest:
    properties:
      identity:
        example: user-123
        type: string
      room:
        example: my-room
        type: string
    required:
    - identity
    - room
    type: object
  handler.SignalRequest:
    properties:
      data: {}
      identity:
        example: user-123
        type: string
      room:
        example: my-room
        type: string
      type:
        example: offer
        type: string
    required:
    - type
    type: object
  pkg.ErrCode:
    enum:
    - 0
    - 1001
    - 1002
    - 1003
    - 1010
    - 1011
    - 1012
    - 1013
    - 2001
    - 3001
    - 3002
    - 5001
    - 6001
    - 6002
    - 7001
    - 7002
    - 7003
    - 7004
    type: integer
    x-enum-varnames:
    - SUCCESS
    - TOKEN_NOT_EXIST
    - TOKEN_WRONG
    - TOKEN_EXPIRED
    - INVALID_PASSWORD
    - USER_NOT_FOUND
    - USERNAME_EXISTS
    - FORBIDDEN
    - INVALID_PARAMS
    - NOT_FOUND
    - ALREADY_EXISTS
    - INTERNAL_ERROR
    - LIVEKIT_NOT_CONFIGURED
    - LIVEKIT_ERROR
    - OAUTH_PROVIDER_NOT_FOUND
    - OAUTH_PROVIDER_DISABLED
    - OAUTH_TOKEN_EXCHANGE_FAILED
    - OAUTH_GET_USER_FAILED
  pkg.Response:
    properties:
      code:
        $ref: '#/definitions/pkg.ErrCode'
      data: {}
      msg:
        type: string
    type: object
  service.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  service.RegisterRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
host: localhost:8998
info:
  contact:
    name: NoelOrin
    url: https://github.com/NoelOrin
  description: GoRTC - WebRTC 服务器端 API 接口文档
  license:
    name: MIT 许可证
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/NoelOrin/GoRTC
  title: GoRTC API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 验证用户并返回 JWT token
      parameters:
      - description: 登录凭据
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      description: 使当前会话失效（需要 Bearer token）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 认证
  /auth/refresh:
    post:
      description: 为已认证用户刷新 JWT token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 刷新当前用户 token
      tags:
      - 认证
  /auth/refresh_token:
    post:
      consumes:
      - application/json
      description: 使用刷新 token 获取新的访问 token
      parameters:
      - description: 刷新 token
        in: body
        name: request
        required: true
        schema:
          properties:
            refresh_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: 刷新 JWT token
      tags:
      - 认证
  /auth/register:
    post:
      consumes:
      - application/json
      description: 注册新用户账号
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: 用户注册
      tags:
      - 认证
  /signal/participants:
    get:
      description: 获取指定 LiveKit 房间中的所有参与者
      parameters:
      - description: 房间名称
        in: query
        name: room
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: 获取房间参与者
      tags:
      - 信令
  /signal/rooms:
    get:
      description: 从 LiveKit 获取所有活跃房间
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: 获取房间列表
      tags:
      - 信令
  /signal/signal:
    post:
      consumes:
      - application/json
      description: 中继 WebRTC 信令消息（offer/answer/ICE candidate）
      parameters:
      - description: 信令消息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SignalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: 交换信令消息
      tags:
      - 信令
  /signal/token:
    post:
      consumes:
      - application/json
      description: 生成用于加入房间的 LiveKit 访问 token
      parameters:
      - description: 房间和身份标识
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.JoinRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: 获取 LiveKit 加入 token
      tags:
      - 信令
  /user/{id}:
    delete:
      description: 根据用户 ID 删除用户
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - 用户
    get:
      description: 通过用户 ID 获取用户信息
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 根据 ID 获取用户
      tags:
      - 用户
  /user/{id}/role:
    put:
      consumes:
      - application/json
      description: 管理员更新用户角色（admin/user）
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 角色信息
        in: body
        name: role
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 更新用户角色
      tags:
      - 用户
  /user/list:
    get:
      description: 分页获取用户列表
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页条数（默认 20，最大 100）
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 获取用户列表
      tags:
      - 用户
  /user/profile:
    get:
      description: 获取当前已认证用户的资料信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 获取用户资料
      tags:
      - 用户
securityDefinitions:
  BearerAuth:
    description: Type "Bearer " followed by your JWT token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
